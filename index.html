/* js/exercises.js */
/*
 * Esecuzione degli esercizi: scelta multipla, completamento, riordino, abbinamento, vero/falso, dettato.
 * runSession() presenta una serie di item, dà un riscontro immediato con spiegazione e suggerimento
 * per la lingua d'origine, ripropone alla fine gli item sbagliati (apprendimento per padronanza)
 * e restituisce il risultato.
 */
(function () {
  'use strict';
  const IL2 = window.IL2 = window.IL2 || {};
  const { esc, shuffle, toast } = IL2.ui;

  function norm(s) {
    return String(s || '').toLowerCase().replace(/[’‘`´]/g, '\'').replace(/[“”«»"]/g, '').replace(/[.,;:!?¿¡()\-–—]/g, ' ')
      .replace(/\s*'\s*/g, '\'').replace(/\s+/g, ' ').trim();
  }
  function strip(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, ''); }

  // Valuta una risposta scritta: 'ok' | 'accent' (giusta tranne gli accenti) | 'no'
  function grade(given, accepted) {
    const g = norm(given);
    if (!g) return 'no';
    for (const a of accepted) if (norm(a) === g) return 'ok';
    for (const a of accepted) if (strip(norm(a)) === strip(g)) return 'accent';
    return 'no';
  }

  // Le consegne sono solo in italiano: la lingua d'origine compare soltanto nel dizionario.
  function l1Line() { return ''; }

  function speakBtn(text, label) {
    return '<button type="button" class="btn icon say" data-say="' + esc(text) + '" aria-label="' + esc(label || 'Ascolta') + '" title="Ascolta">' + IL2.ui.icon('speaker') + '</button>';
  }
  function bindSay(root) {
    root.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => IL2.speech.say(b.dataset.say, { rate: b.dataset.slow ? 0.65 : undefined })));
  }

  // ---------- Renderizzatori ----------
  // Ogni renderer riempie "box" e restituisce { getAnswer(): string|null, check(): {ok, accent, given, expected} }
  const R = {};

  R.mc = function (box, item, opts) {
    const options = item._order || (item._order = shuffle(item.o.map((t, i) => ({ t, i }))));
    let chosen = null;
    let head = '';
    if (item.text) head += '<div class="passage">' + esc(item.text).replace(/\n/g, '<br>') + '</div>';
    if (item.say) head += '<div class="listen-row">' + speakBtn(item.say, 'Ascolta') + '<button type="button" class="btn ghost small" data-say="' + esc(item.say) + '" data-slow="1">' + IL2.ui.icon('slow') + ' Più lento</button></div>';
    box.innerHTML = head + '<p class="q">' + esc(item.q) + '</p>' + l1Line('chooseAnswer') +
      '<div class="options" role="radiogroup">' + options.map((o, k) => '<button type="button" role="radio" aria-checked="false" class="opt" data-k="' + k + '">' + esc(o.t) + '</button>').join('') +
      (opts.allowDontKnow ? '<button type="button" class="opt dont" data-k="-1">Non lo so</button>' : '') + '</div>';
    bindSay(box);
    if (item.say && opts.autoplay !== false) setTimeout(() => IL2.speech.say(item.say), 300);
    box.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      box.querySelectorAll('.opt').forEach(x => { x.classList.remove('sel'); x.setAttribute('aria-checked', 'false'); });
      b.classList.add('sel'); b.setAttribute('aria-checked', 'true'); chosen = +b.dataset.k;
      opts.onReady();
      if (opts.instant) opts.submit();
    }));
    return {
      ready: () => chosen !== null,
      check() {
        const correct = item.o[item.a];
        const ok = chosen >= 0 && options[chosen].i === item.a;
        box.querySelectorAll('.opt').forEach(b => {
          const k = +b.dataset.k; b.disabled = true;
          if (k >= 0 && options[k].i === item.a) b.classList.add('right');
          else if (k === chosen) b.classList.add('wrong');
        });
        return { ok, given: chosen >= 0 ? options[chosen].t : '(non lo so)', expected: correct };
      }
    };
  };

  R.tf = function (box, item, opts) {
    const it = Object.assign({}, item, { o: ['Vero', 'Falso'], a: item.a ? 0 : 1, _order: [{ t: 'Vero', i: 0 }, { t: 'Falso', i: 1 }] });
    const r = R.mc(box, it, opts);
    const p = box.querySelector('.q'); if (p) p.insertAdjacentHTML('afterend', l1Line('trueFalse'));
    return r;
  };

  R.gap = function (box, item, opts) {
    const blanks = (item.q.match(/___/g) || []).length;
    const multi = blanks > 1;
    let q = esc(item.q);
    const input = '<input class="gap-in' + (item.full ? ' short' : '') + '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Risposta">';
    if (!multi && blanks === 1) q = q.replace('___', input);
    box.innerHTML = '<p class="q gap-q">' + q + (item.hint ? ' <span class="hint">(' + esc(item.hint) + ')</span>' : '') + '</p>' +
      (multi || !blanks ? '<input class="gap-in wide" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Risposta">' : '') +
      (multi ? '<p class="small muted">Più spazi: scrivi le risposte in ordine, separate da una virgola.</p>' : '') +
      l1Line('writeAnswer') + accentBar();
    const inp = box.querySelector('.gap-in');
    bindAccents(box, inp);
    inp.addEventListener('input', () => opts.onReady());
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); opts.submit(); } });
    setTimeout(() => inp.focus(), 50);
    return {
      ready: () => inp.value.trim().length > 0,
      check() {
        inp.disabled = true;
        const g = grade(inp.value, item.a);
        inp.classList.add(g === 'no' ? 'wrong' : 'right');
        return { ok: g !== 'no', accent: g === 'accent', given: inp.value, expected: item.a[0] };
      }
    };
  };

  R.dict = function (box, item, opts) {
    box.innerHTML = '<div class="listen-row big">' + speakBtn(item.say, 'Ascolta') + '<button type="button" class="btn ghost small" data-say="' + esc(item.say) + '" data-slow="1">' + IL2.ui.icon('slow') + ' Più lento</button></div>' +
      '<p class="q">Ascolta e scrivi la frase.</p>' + l1Line('listenWrite') +
      '<textarea class="gap-in wide" rows="2" autocomplete="off" autocapitalize="sentences" spellcheck="false" aria-label="Scrivi quello che senti"></textarea>' + accentBar();
    bindSay(box);
    const inp = box.querySelector('textarea');
    bindAccents(box, inp);
    if (opts.autoplay !== false) setTimeout(() => IL2.speech.say(item.say), 300);
    inp.addEventListener('input', () => opts.onReady());
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); opts.submit(); } });
    return {
      ready: () => inp.value.trim().length > 0,
      check() {
        inp.disabled = true;
        const g = grade(inp.value, item.a.concat([item.say]));
        inp.classList.add(g === 'no' ? 'wrong' : 'right');
        return { ok: g !== 'no', accent: g === 'accent', given: inp.value, expected: item.say };
      }
    };
  };

  R.order = function (box, item, opts) {
    const words = item._order || (item._order = shuffle(item.words.map((w, i) => ({ w, i }))));
    const picked = [];
    function draw() {
      box.innerHTML = '<p class="q">Metti le parole in ordine.</p>' + l1Line('orderWords') +
        '<div class="answer-line" aria-label="La tua frase">' + (picked.length ? picked.map((k, j) => '<button type="button" class="chip on" data-j="' + j + '">' + esc(words[k].w) + '</button>').join('') : '<span class="muted small">Tocca le parole qui sotto</span>') + '</div>' +
        '<div class="chips">' + words.map((o, k) => picked.includes(k) ? '<span class="chip ghost">' + esc(o.w) + '</span>' : '<button type="button" class="chip" data-k="' + k + '">' + esc(o.w) + '</button>').join('') + '</div>';
      box.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => { picked.push(+b.dataset.k); draw(); opts.onReady(); }));
      box.querySelectorAll('[data-j]').forEach(b => b.addEventListener('click', () => { picked.splice(+b.dataset.j, 1); draw(); opts.onReady(); }));
    }
    draw();
    return {
      ready: () => picked.length === words.length,
      check() {
        const given = picked.map(k => words[k].w).join(' ');
        const ok = norm(given) === norm(item.a);
        box.querySelector('.answer-line').classList.add(ok ? 'right' : 'wrong');
        box.querySelectorAll('button').forEach(b => { b.disabled = true; });
        return { ok, given, expected: item.a };
      }
    };
  };

  R.match = function (box, item, opts) {
    const rights = item._rights || (item._rights = shuffle(item.pairs.map(p => p[1])));
    const uniq = Array.from(new Set(rights));
    box.innerHTML = '<p class="q">' + esc(item.prompt || 'Abbina gli elementi.') + '</p>' + l1Line('matchPairs') +
      '<div class="match">' + item.pairs.map((p, i) => '<label class="match-row"><span>' + esc(p[0]) + '</span><select data-i="' + i + '"><option value="">— scegli —</option>' +
        uniq.map(r => '<option>' + esc(r) + '</option>').join('') + '</select></label>').join('') + '</div>';
    const sels = Array.from(box.querySelectorAll('select'));
    sels.forEach(s => s.addEventListener('change', () => opts.onReady()));
    return {
      ready: () => sels.every(s => s.value),
      check() {
        let all = true;
        sels.forEach((s, i) => { const ok = s.value === item.pairs[i][1]; s.disabled = true; s.classList.add(ok ? 'right' : 'wrong'); if (!ok) all = false; });
        return { ok: all, given: sels.map(s => s.value).join(', '), expected: item.pairs.map(p => p[0] + ' → ' + p[1]).join(', ') };
      }
    };
  };

  // Tastierina per vocali accentate (utile su tastiere straniere).
  function accentBar() {
    return '<div class="accents" aria-label="Lettere accentate">' + ['à', 'è', 'é', 'ì', 'ò', 'ù', '\''].map(c => '<button type="button" class="key" data-ch="' + c + '" tabindex="-1">' + c + '</button>').join('') + '</div>';
  }
  function bindAccents(box, inp) {
    box.querySelectorAll('.key').forEach(b => b.addEventListener('mousedown', e => e.preventDefault()));
    box.querySelectorAll('.key').forEach(b => b.addEventListener('click', () => {
      const s = inp.selectionStart || inp.value.length, e = inp.selectionEnd || inp.value.length;
      inp.value = inp.value.slice(0, s) + b.dataset.ch + inp.value.slice(e);
      inp.focus(); inp.selectionStart = inp.selectionEnd = s + 1; inp.dispatchEvent(new Event('input'));
    }));
  }

  // ---------- Sessione ----------
  /*
   * opts: { title, level, src, items, feedback (default true), requeue (default true), allowDontKnow,
   *         onAnswer(item, res), engine (PlacementTest: sceglie gli item adattivamente), exitLabel }
   */
  function runSession(root, opts) {
    return new Promise(resolve => {
      const feedback = opts.feedback !== false;
      const queue = opts.items ? opts.items.slice() : [];
      const missedOnce = new Set();
      const results = []; const misses = [];
      const started = Date.now();
      let total = opts.engine ? null : queue.length;
      let done = 0, firstTryOk = 0;
      let current = null, renderer = null, phase = 'answer';

      root.innerHTML = '<div class="session">' +
        '<div class="session-top"><button type="button" class="btn icon ghost quit" aria-label="Esci">' + IL2.ui.icon('close') + '</button>' +
        '<div class="progress"><span></span></div><span class="count small muted"></span></div>' +
        (opts.title ? '<h2 class="session-title">' + esc(opts.title) + '</h2>' : '') +
        '<div class="card exercise" aria-live="polite"></div>' +
        '<div class="fb" hidden></div>' +
        '<div class="session-actions"><button type="button" class="btn ghost small report" title="Segnala un problema con questo esercizio">' + IL2.ui.icon('flag') + ' Segnala</button>' +
        '<button type="button" class="btn primary go" disabled>Controlla</button></div></div>';
      const box = root.querySelector('.exercise'), fb = root.querySelector('.fb'), go = root.querySelector('.go');
      const bar = root.querySelector('.progress span'), count = root.querySelector('.count');

      root.querySelector('.quit').addEventListener('click', async () => {
        if (done === 0 || await IL2.ui.confirm('Vuoi uscire? I progressi delle risposte date sono già salvati.', 'Esci')) finish(true);
      });
      root.querySelector('.report').addEventListener('click', () => report(current, opts));

      function progress() {
        const p = opts.engine ? opts.engine.progress() : results.length / Math.max(1, results.length + queue.length + 1);
        bar.style.width = Math.round(100 * Math.min(1, p)) + '%';
        count.textContent = opts.engine ? (done + 1) + '' : Math.min(done + 1, total) + ' / ' + total;
      }

      function next() {
        IL2.speech.stop();
        current = opts.engine ? opts.engine.next() : queue.shift();
        if (!current) return finish(false);
        phase = 'answer'; fb.hidden = true; fb.innerHTML = '';
        go.textContent = 'Controlla';
        go.disabled = true;
        const fn = R[current.t] || R.mc;
        renderer = fn(box, current, {
          allowDontKnow: opts.allowDontKnow, autoplay: true,
          onReady: () => { if (phase === 'answer') go.disabled = !renderer.ready(); },
          submit: () => { if (phase === 'answer' && renderer.ready()) submit(); },
          instant: false
        });
        progress();
        box.scrollIntoView({ block: 'nearest' });
      }

      function submit() {
        phase = 'feedback';
        const res = renderer.check();
        if (opts.engine) opts.engine.answer(current, res.ok);
        const firstTime = !missedOnce.has(current.uid || current.id);
        if (firstTime) { done++; if (res.ok) firstTryOk++; }
        results.push({ item: current, ok: res.ok, firstTime });
        if (!res.ok && firstTime) misses.push(current.uid || current.id);
        if (opts.onAnswer) opts.onAnswer(current, res, firstTime);
        if (!res.ok && opts.requeue !== false && !opts.engine && firstTime) { missedOnce.add(current.uid || current.id); queue.push(Object.assign({}, current, { _retry: true })); }
        if (!feedback) { setTimeout(next, 150); return; }
        showFeedback(res);
        go.disabled = false;
        go.textContent = queue.length || opts.engine ? 'Avanti' : 'Fine';
        go.focus();
      }

      function showFeedback(res) {
        let h = '';
        if (res.ok && !res.accent) h += '<div class="ok-line">' + IL2.ui.icon('check') + ' ' + pick(['Giusto!', 'Esatto!', 'Perfetto!', 'Ottimo!', 'Molto bene!']) + '</div>';
        else if (res.ok && res.accent) h += '<div class="warn-line">' + IL2.ui.icon('alert') + ' Quasi! Attenzione agli accenti: <b>' + esc(res.expected) + '</b></div>';
        else h += '<div class="no-line">' + IL2.ui.icon('close') + ' La risposta giusta è: <b>' + esc(res.expected) + '</b>' + (current.t === 'dict' || current.t === 'gap' ? ' ' + speakBtn(res.expected) : '') + '</div>';
        if (current.exp && (!res.ok || res.accent)) h += '<p class="exp">' + esc(current.exp) + '</p>';
        if (!res.ok && current._retry === undefined && opts.requeue !== false && !opts.engine) h += '<p class="small muted">Questo esercizio tornerà alla fine.</p>';
        fb.innerHTML = h; fb.hidden = false; fb.className = 'fb ' + (res.ok ? 'good' : 'bad');
        root.querySelector('.session').classList.remove('pulse-good', 'pulse-bad'); void fb.offsetWidth;
        root.querySelector('.session').classList.add(res.ok ? 'pulse-good' : 'pulse-bad');
        bindSay(fb);
      }

      go.addEventListener('click', () => { if (phase === 'answer') { if (renderer.ready()) submit(); } else next(); });

      function finish(aborted) {
        IL2.speech.stop();
        resolve({ aborted, total: done, correct: firstTryOk, results, misses, durationSec: Math.round((Date.now() - started) / 1000) });
      }
      next();
    });
  }

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  async function report(item, opts) {
    if (!item) return;
    const r = await IL2.ui.modal('<h3>Segnala un problema</h3><p class="small muted">La segnalazione arriva all\'insegnante e aiuta a migliorare l\'app.</p>' +
      '<div class="stack"><label><input type="radio" name="k" value="errore" checked> C\'è un errore nell\'esercizio</label>' +
      '<label><input type="radio" name="k" value="difficile"> È troppo difficile</label>' +
      '<label><input type="radio" name="k" value="non-capisco"> Non capisco la consegna</label>' +
      '<label><input type="radio" name="k" value="audio"> L\'audio non funziona</label>' +
      '<textarea rows="3" placeholder="Scrivi qui (facoltativo)"></textarea></div>' +
      '<div class="row end"><button class="btn ghost" data-close="null">Annulla</button><button class="btn primary" data-close="send">Invia</button></div>', {
      onOpen: (m, close) => { m._get = () => ({ kind: m.querySelector('input[name=k]:checked').value, text: m.querySelector('textarea').value }); IL2._lastModal = m; }
    });
    if (r !== 'send') return;
    const v = IL2._lastModal._get();
    try {
      await IL2.api.call('sendFeedback', { ref: item.uid || item.id || '', kind: v.kind, text: v.text, context: (opts.title || '') + ' · ' + (item.q || item.say || '').slice(0, 200) });
      toast('Grazie! Segnalazione inviata.', 'good');
    } catch (e) { toast(e.message, 'bad'); }
  }

  IL2.exercises = { runSession, grade, norm, speakBtn, bindSay, accentBar, bindAccents, l1Line, report };
})();

(function () {

  const DAY = 86400000;

  // «Completa le frasi»: la frase di esempio con la parola nascosta, da scegliere fra le parole del tema.
  function clozeItems(t) {
    const rx = w => new RegExp('(^|[^\\p{L}])(' + w.it.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![\\p{L}])', 'iu');
    return t.words.filter(w => w.ex && rx(w).test(w.ex)).map(w => {
      const others = shuffle(t.words.filter(x => x.id !== w.id)).slice(0, 3);
      return { id: 'cl-' + w.id, t: 'mc', q: 'Completa la frase: «' + w.ex.replace(rx(w), '$1_____') + '»', o: [w.it].concat(others.map(o => o.it)), a: 0, skill: 'lessico', lv: t.level, _w: w };
    });
  }
  async function clozeQuiz(view, t) {
    const p = P();
    const items = shuffle(clozeItems(t)).slice(0, 10);
    const r = await X.runSession(view, { title: 'Completa le frasi: ' + t.title, items, onAnswer: (item, res, first) => { if (first) { E.recordAnswer(p, item, res.ok, { logError: false }); E.srsReview(p, item._w.id, res.ok ? 2 : 0); } } });
    done({ type: 'vocab', ref: t.id, skill: 'lessico', correct: r.correct, total: r.total, durationSec: r.durationSec });
    IL2.award(2 + r.correct);
    view.innerHTML = resultCard(r, '', btn('tema/' + encodeURIComponent(t.id), 'Torna alle parole') + btn(t.materia ? 'materie?m=' + t.materia : 'oggi', t.materia ? 'Materie' : 'Oggi', 'primary'));
  }

  R.ripasso = async function (view) {

    flashcards(view, ids.map(wordById), 'Ripasso delle parole', 'review', 'srs');
  };

  function flashcards(view, words, title, type, ref) {
    const p = P(); let i = 0; const started = Date.now(); let ok = 0;
    const queue = words.slice();
    function draw() {
      const w = queue[i];
      if (!w) return end();
      const reverse = p.srs[w.id] && p.srs[w.id].box >= 2 && Math.random() < 0.5;
      view.innerHTML = '<div class="session"><div class="session-top"><a class="btn icon ghost" href="#/parole" aria-label="Esci">' + icon('close') + '</a><div class="progress"><span style="width:' + Math.round(100 * i / queue.length) + '%"></span></div><span class="count small muted">' + (i + 1) + ' / ' + queue.length + '</span></div>' +
        '<h2 class="session-title">' + esc(title) + '</h2>' +
        '<div class="card flash" tabindex="0" role="button" aria-label="Gira la carta"><div class="front">' + (reverse ? '<div class="g" dir="' + trDir(w) + '" lang="' + trLang(w) + '">' + esc(translation(w)) + '</div><small class="muted">Come si dice in italiano?</small>' : '<div class="w" lang="it">' + esc(w.it) + '</div>' + X.speakBtn(w.it)) + '</div>' +
        '<div class="back" hidden><div class="w" lang="it">' + esc(w.it) + ' ' + X.speakBtn(w.it) + '</div><div class="g" dir="' + trDir(w) + '" lang="' + trLang(w) + '">' + esc(translation(w)) + '</div>' + (w.ex ? '<div class="ex"><i lang="it">' + esc(w.ex) + '</i> ' + X.speakBtn(w.ex) + '</div>' : '') + '</div>' +
        '<p class="small muted center turn">Tocca la carta per girarla</p></div>' +
        '<div class="grade-row" hidden><button class="btn bad" data-q="0">Non lo so</button><button class="btn warn" data-q="1">Difficile</button><button class="btn good" data-q="2">Lo so</button><button class="btn primary" data-q="3">Facile</button></div></div>';
      X.bindSay(view);
      if (!reverse) setTimeout(() => IL2.speech.say(w.it), 200);
      const card = view.querySelector('.flash');
      const flip = e => {
        if (e && e.target.closest('[data-say]')) return;
        card.classList.add('flipped'); card.querySelector('.back').hidden = false; card.querySelector('.turn').hidden = true; view.querySelector('.grade-row').hidden = false;
        if (reverse) IL2.speech.say(w.it);
      };
      card.addEventListener('click', flip); card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
      view.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => {
        const qv = +b.dataset.q; E.srsReview(p, w.id, qv);
        E.recordAnswer(p, { skill: 'lessico', lv: w.level || E.currentLevel(p) }, qv >= 2, { logError: false });
        if (qv >= 2) ok++; else if (qv === 0 && queue.filter(x => x === w).length < 2) queue.push(w);
        i++; IL2.save(); draw();
      }));
    }
    function end() {
      const r = { correct: ok, total: queue.length, durationSec: Math.round((Date.now() - started) / 1000) };
      done({ type, ref, skill: 'lessico', correct: ok, total: queue.length, durationSec: r.durationSec });
      IL2.award(2 + ok);
      view.innerHTML = resultCard(r, '<p>Le parole torneranno nel ripasso quando sarà il momento di rinfrescarle.</p>', btn('parole', 'Parole') + btn('oggi', 'Torna a Oggi', 'primary'));
    }
    draw();
  }

  async function recordAudio(btnEl, onDone) {
    const li = btnEl.closest('li'); const out = li.querySelector('.s-out');
    if (!navigator.mediaDevices || !window.MediaRecorder) { out.innerHTML = '<p class="small">La registrazione non è disponibile su questo dispositivo.</p>'; return; }
    if (btnEl._rec) { btnEl._rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const rec = new MediaRecorder(stream); const chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop()); btnEl._rec = null; btnEl.innerHTML = icon('mic') + ' Registrati';
        const url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
        out.innerHTML = '<audio controls src="' + url + '"></audio><p class="small">Ascolta la tua voce e confrontala con il modello. Com\'è andata? <button class="btn small good" data-self="1">Bene</button> <button class="btn small warn" data-self="0">Da migliorare</button></p>';
        out.querySelectorAll('[data-self]').forEach(x => x.addEventListener('click', () => { E.recordAnswer(P(), { skill: 'parlato', lv: E.currentLevel(P()) }, x.dataset.self === '1', { logError: false }); onDone(); IL2.save(); x.parentNode.textContent = 'Grazie! Continua ad allenarti.'; }));
      };
      rec.start(); btnEl._rec = rec; btnEl.innerHTML = icon('stop') + ' Stop';
    } catch (e) { out.innerHTML = '<p class="small bad-text">Il microfono non è disponibile: controlla i permessi del browser.</p>'; }
  }

  R.test = async function (view) {
    const p = P(), st = S();
    const td = E.testDue(p, st.settings);
    const upReady = E.levelUpReady(p);
    const canSelf = st.settings && st.settings.allowSelfRetest;
    const last = p.placement[p.placement.length - 1];
    if (!td.due && !canSelf && !upReady) {
      view.innerHTML = '<h1>Test di livello</h1><div class="card"><p>Il prossimo test periodico è previsto ' + (td.inDays != null ? 'tra <b>' + td.inDays + ' giorni</b> (' + fmtDate(p.nextTestDue) + ')' : 'più avanti') + '.</p>' + (last ? '<p>Ultimo risultato: ' + levelBadge(last.level, last.sublevel) + ' del ' + fmtDate(last.at) + '.</p>' : '') +
        '<p class="small muted">Puoi farlo prima quando avrai completato almeno l\'80% delle lezioni del tuo livello, oppure se te lo chiede l\'insegnante.</p>' + btn('profilo', 'Vedi i tuoi risultati') + '</div>';
      return;
    }
    // Istruzioni brevi e dirette: chi arriva può non parlare ancora italiano.
    const rules = '<ul class="easy-list"><li><span aria-hidden="true">👆</span> Scegli la risposta.</li><li><span aria-hidden="true">🤷</span> Non sai? Premi <b>«Non lo so»</b>.</li><li><span aria-hidden="true">🔊</span> Alza il volume.</li><li><span aria-hidden="true">🙂</span> Non è un voto.</li></ul>';
    if (p.placement.length) {
      view.innerHTML = '<h1>Test di livello</h1><div class="card test-intro easy">' + rules + '<button class="btn primary big" id="start">Comincia</button></div>';
    } else {
      // Primo accesso: poche domande dirette (sì / no) per partire dal livello giusto.
      const STEPS = {
        q1: { q: 'Parli italiano?', a: [['🙁', 'No', -2.4], ['🙂', 'Un po\'', 'q2'], ['😀', 'Sì', 'q3']] },
        q2: { q: 'Leggi. Capisci?', text: 'Mi chiamo Ana. Ho quattordici anni.', a: [['✅', 'Sì', -1.6], ['❌', 'No', -2.2]] },
        q3: { q: 'Leggi. Capisci?', text: 'Ieri sono andato al cinema con i miei amici.', a: [['✅', 'Sì', 'q4'], ['❌', 'No', -1.4]] },
        q4: { q: 'Leggi. Capisci?', text: 'Se avessi saputo dell\'esame, avrei studiato di più.', a: [['✅', 'Sì', 0.6], ['❌', 'No', -0.4]] }
      };
      const answers = [];
      const step = id => {
        const st0 = STEPS[id];
        view.innerHTML = '<div class="welcome card easy"><div class="big-emoji" aria-hidden="true">👋</div><h1>Ciao!</h1>' +
          '<h2 class="easy-q">' + st0.q + '</h2>' + (st0.text ? '<p class="easy-text" lang="it">«' + esc(st0.text) + '» ' + X.speakBtn(st0.text) + '</p>' : '') +
          '<div class="easy-answers">' + st0.a.map(([e, l], i) => '<button class="opt easy-a" data-a="' + i + '"><span aria-hidden="true">' + e + '</span> ' + l + '</button>').join('') + '</div></div>';
        X.bindSay(view);
        view.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => {
          const [, l, next] = st0.a[+b.dataset.a];
          answers.push(st0.q + (st0.text ? ' «' + st0.text + '»' : '') + ' ' + l);
          if (typeof next === 'string') return step(next);
          view.innerHTML = '<h1>Test di livello</h1><div class="card test-intro easy">' + rules + '<button class="btn primary big" id="start">Comincia</button></div>';
          view.querySelector('#start').addEventListener('click', () => begin(next, answers.join(' · ')));
        }));
      };
      step('q1');
    }
    const begin = async (startTheta, selfLabel) => {
      const recent = last ? last.ids || [] : [];
      const engine = new E.PlacementTest(C.placement, { startTheta, recentIds: recent, length: st.settings && st.settings.placementLength });
      const r = await X.runSession(view, { title: 'Test di livello', engine, feedback: false, allowDontKnow: true, requeue: false });
      if (r.aborted && engine.responses.length < 8) { toast('Test interrotto: potrai riprenderlo quando vuoi.'); return IL2.go('oggi'); }
      const res = engine.result(); res.selfAssessment = selfLabel || '';
      const skills = {};
      for (const s of E.SKILLS) skills[s] = res.perSkill[s] ? res.perSkill[s].theta : (p.placement.length && typeof p.skills[s] === 'number' ? (p.skills[s] + res.theta) / 2 : res.theta);
      res.skills = skills;
      const prev = last, prevLevel = E.currentLevel(p);
      let out = null;
      while (!out) {

/*
 * Giochi per ripassare il lessico: bingo per immagini e cruciverba.
 * Le parole vengono dai temi di Parole e Materie; valgono gli sblocchi per livello.
 * La parte senza interfaccia (IL2.games) gira anche in Node per i controlli sui contenuti.

(function () {

  // ---------- Utilità pure ----------
  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  function shuffleWith(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const img = w => C.IMMAGINI && C.IMMAGINI[w.it];

  G.norm = s => String(s || '').trim().toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, ' ');
  G.bare = s => G.norm(s).normalize('NFD').replace(/[̀-ͯ]/g, '');

  // ---------- Cruciverba ----------
  // Dieci cruciverba, due per livello. Le definizioni sono sempre a parole: dalla A1 alla B1 una frase
  // da completare, al B2 e al C1 una definizione in italiano. Ai livelli bassi parole più corte, meno
  // parole, l'elenco delle parole da inserire e (A1) la prima lettera già scritta.
  G.LEVEL_RULES = {
    A1: { maxLen: 6, n: 6, bank: true, first: true },
    A2: { maxLen: 7, n: 7, bank: true, first: false },
    B1: { maxLen: 8, n: 8, bank: true, first: false },
    B2: { maxLen: 10, n: 9, bank: true, first: false },
    C1: { maxLen: 11, n: 10, bank: false, first: false }
  };
  G.CROSSWORDS = [
    { id: 'cw-1', level: 'A1', title: 'A scuola, a casa, a tavola', themes: ['a1-scuola', 'a1-famiglia', 'a1-cibo', 'a1-giornata', 'a1-saluti'] },
    { id: 'cw-2', level: 'A1', title: 'In città e nella natura', themes: ['a1-citta', 'a1-tempo', 'mat-scienze-a1', 'mat-geografia-a1', 'a1-consegne'] },
    { id: 'cw-3', level: 'A2', title: 'Casa, corpo e viaggi', themes: ['a2-casa', 'a2-corpo-salute', 'a2-viaggi'] },
    { id: 'cw-4', level: 'A2', title: 'Tempo libero, lavori e scienze', themes: ['a2-tempo-libero', 'a2-lavori', 'a2-infanzia', 'a2-negozi', 'mat-scienze-a2', 'mat-storia-a2', 'studio-matematica'] },
    { id: 'cw-5', level: 'B1', title: 'Emozioni, scuola e regole', themes: ['b1-emozioni', 'b1-comunicazione', 'b1-lavoro-studio', 'b1-casa-regole'] },
    { id: 'cw-6', level: 'B1', title: 'Ambiente, scienze e storia', themes: ['b1-ambiente', 'studio-scienze', 'mat-storia-b1', 'mat-geografia-b1', 'b1-opinioni'] },
    { id: 'cw-7', level: 'B2', title: 'Società e informazione', themes: ['b2-societa', 'b2-media', 'mat-storia-b2'] },
    { id: 'cw-8', level: 'B2', title: 'Scienza e territorio', themes: ['b2-scienza', 'mat-scienze-b2', 'mat-geografia-b2'] },
    { id: 'cw-9', level: 'C1', title: 'Parole astratte e cultura', themes: ['c1-astratto', 'c1-cultura'] },
    { id: 'cw-10', level: 'C1', title: 'Il linguaggio delle discipline', themes: ['mat-scienze-c1', 'mat-storia-c1', 'mat-geografia-c1', 'c1-idiomi'] }

  G.CROSSWORDS.forEach(s => Object.assign(s, G.LEVEL_RULES[s.level]));

  function clueFor(w, level) {

  // Disposizione: ogni parola deve incrociarne almeno un'altra; si prova più volte e si tiene la griglia migliore.
  function layout(list, max, limit) {
    const cells = new Map(); // "x,y" → { ch, dirs: Set }
    const placed = [];
    const at = (x, y) => cells.get(x + ',' + y);
    let minX = 0, maxX = 0, minY = 0, maxY = 0;
    function fits(word, x, y, dx, dy) {
      let cross = 0;
      if (at(x - dx, y - dy) || at(x + dx * word.length, y + dy * word.length)) return -1;
      for (let k = 0; k < word.length; k++) {
        const cx = x + dx * k, cy = y + dy * k, c = at(cx, cy);
        if (c) { if (c.ch !== word[k] || c.dirs.has(dx ? 'a' : 'd')) return -1; cross++; }
        else if (at(cx + dy, cy + dx) || at(cx - dy, cy - dx)) return -1;
      }

      if (nx1 - nx0 + 1 > limit || ny1 - ny0 + 1 > limit) return -1;
      return cross;
    }
    function put(e, x, y, dx, dy) {
      for (let k = 0; k < e.answer.length; k++) {
        const key = (x + dx * k) + ',' + (y + dy * k);
        const c = cells.get(key) || { ch: e.answer[k], dirs: new Set() };
        c.dirs.add(dx ? 'a' : 'd'); cells.set(key, c);
      }
      minX = Math.min(minX, x); maxX = Math.max(maxX, x + dx * (e.answer.length - 1));

    }

    for (const e of list.slice(1)) {
      if (placed.length >= max) break;
      let best = null;
      for (const [key, c] of cells) {
        const [cx, cy] = key.split(',').map(Number);
        for (let i = 0; i < e.answer.length; i++) {
          if (e.answer[i] !== c.ch) continue;
          for (const [dx, dy] of [[1, 0], [0, 1]]) {

            if (cross < 1) continue;
            const area = (Math.max(maxX, x + dx * (e.answer.length - 1)) - Math.min(minX, x) + 1) * (Math.max(maxY, y + dy * (e.answer.length - 1)) - Math.min(minY, y) + 1);
            const score = cross * 40 - area;

    entries.sort((a, b) => a.num - b.num);
    const grid = {};
    for (const e of entries) for (let k = 0; k < e.answer.length; k++) grid[(e.dir === 'a' ? e.x + k : e.x) + ',' + (e.dir === 'd' ? e.y + k : e.y)] = e.answer[k];
    return (cache[id] = Object.assign({}, spec, { w: best.w, h: best.h, entries, grid }));
  };

  // ---------- Bingo: insiemi di parole con immagine ----------
  G.pictureWords = function (themes) {
    const seen = new Set(), out = [];
    for (const t of themes) for (const w of t.words) {
      const e = img(w); if (!e || seen.has(e) || seen.has(w.it)) continue;
      seen.add(e); seen.add(w.it); out.push(Object.assign({ level: t.level }, w, { pic: e, theme: t.id }));
    }
    return out;
  };

  // ======================= Interfaccia studente =======================
  if (!IL2.routes || !IL2.routes.student || !IL2.ui) return;
  const R = IL2.routes.student;
  const { esc, icon, shuffle, toast, levelBadge } = IL2.ui;
  const E = IL2.engine;
  const P = () => IL2.state.profile;
  const open = lv => E.unlocked(P(), lv);
  const say = t => { try { IL2.speech.say(t); } catch (e) { /* audio non disponibile */ } };
  const games = () => (P().gamesDone || (P().gamesDone = {}));
  const NAMES = { A1: 'Contatto', A2: 'Sopravvivenza', B1: 'Soglia', B2: 'Progresso', C1: 'Efficacia' };

  R.giochi = async function (view) {
    const cwDone = G.CROSSWORDS.filter(s => games()[s.id]).length;
    const b = games().bingo;
    view.innerHTML = '<div class="page-head"><h1>Giochi</h1><p class="muted">Per ripassare le parole in un altro modo. Usano il lessico dei livelli che hai sbloccato.</p></div>' +
      '<div class="game-grid">' +
      '<a class="card game-card g-bingo" href="#/bingo"><span class="g-art" aria-hidden="true">🍎 🚌 ☀️<br>📕 🐟 🏠</span><b>Bingo delle parole</b><small>Guarda l\'immagine e trova la parola nella tua cartella, oppure scrivila. Per livello, per argomento o con parole miste.</small>' +
      (b ? '<span class="g-stat">' + b.count + (b.count === 1 ? ' partita' : ' partite') + '</span>' : '') + '</a>' +
      '<a class="card game-card g-cw" href="#/cruciverba"><span class="g-art" aria-hidden="true">C A S A<br>· · · L<br>· · · B</span><b>Cruciverba</b><small>Dieci cruciverba dal più facile al più difficile: prima con frasi da completare, poi con definizioni in italiano.</small>' +
      '<span class="g-stat">' + cwDone + ' su ' + G.CROSSWORDS.length + ' completati</span></a></div>';
  };

  // ---------- Bingo ----------
  function bingoSources() {
    const vocab = C.vocab.filter(t => open(t.level));
    const src = [];
    src.push({ key: 'misto', lv: E.currentLevel(P()), label: 'Misto', sub: 'Parole da lezioni e temi diversi', words: () => {
      const studied = new Set(Object.keys(P().srs));
      const all = G.pictureWords(shuffle(vocab));
      const mine = all.filter(w => studied.has(w.id));
      return shuffle(mine).slice(0, 10).concat(shuffle(all.filter(w => !studied.has(w.id))));
    } });
    for (const lv of E.LEVELS) {
      const n = G.pictureWords(C.vocab.filter(t => t.level === lv)).length;
      if (n >= 9) src.push({ key: 'liv-' + lv, group: 'Per livello', label: lv, sub: NAMES[lv], locked: !open(lv), lv, words: () => G.pictureWords(C.vocab.filter(t => t.level === lv)) });
    }
    for (const m of C.MATERIE || []) {
      const ts = () => vocab.filter(t => t.materia === m.id || (t.studio && new RegExp(m.id, 'i').test(t.id)));
      if (G.pictureWords(ts()).length >= 9) src.push({ key: 'mat-' + m.id, group: 'Materie', label: m.icon + ' ' + m.name, sub: 'Fino al tuo livello', words: () => G.pictureWords(ts()) });
    }
    for (const t of C.vocab) {
      if (t.materia || G.pictureWords([t]).length < 9) continue;
      src.push({ key: 'tema-' + t.id, group: 'Per argomento', label: t.icon + ' ' + t.title, sub: t.level, locked: !open(t.level), lv: t.level, words: () => G.pictureWords([t]) });
    }
    return src;
  }

  R.bingo = async function (view, parts, q) {
    const srcs = bingoSources();
    const modo = q.modo === 'scrivi' ? 'scrivi' : 'riconosci';
    const src = srcs.find(s => s.key === q.da);
    if (src && !src.locked) return playBingo(view, src, modo);
    const link = s => s.locked ? '<span class="chip-src locked" title="Si sblocca al livello ' + s.lv + '">' + icon('lock') + esc(s.label) + '</span>'
      : '<a class="chip-src" href="#/bingo?da=' + encodeURIComponent(s.key) + '&modo=' + modo + '"><b>' + esc(s.label) + '</b><small>' + esc(s.sub || '') + '</small></a>';
    const groups = ['Per livello', 'Materie', 'Per argomento'];
    view.innerHTML = '<a class="back" href="#/giochi">' + icon('back') + 'Giochi</a><div class="page-head"><h1>Bingo delle parole</h1><p class="muted">Compare un\'immagine: trova la parola nella tua cartella, oppure scrivila. Fai bingo completando una riga, una colonna o una diagonale.</p></div>' +
      '<div class="seg" role="group" aria-label="Modalità"><a class="' + (modo === 'riconosci' ? 'on' : '') + '" href="#/bingo?modo=riconosci">' + icon('target') + ' Riconosci la parola</a><a class="' + (modo === 'scrivi' ? 'on' : '') + '" href="#/bingo?modo=scrivi">' + icon('pen') + ' Scrivi la parola</a></div>' +
      '<h2 class="h-sec">Con quali parole?</h2><div class="src-row">' + link(srcs[0]) + '</div>' +
      groups.map(g => { const list = srcs.filter(s => s.group === g); return list.length ? '<h3 class="h-sub">' + g + '</h3><div class="src-row">' + list.map(link).join('') + '</div>' : ''; }).join('');
  };

  // Difficoltà del bingo secondo il livello: cartella piccola, prima lettera e audio come aiuto, un errore di battitura tollerato.
  G.BINGO_RULES = {
    A1: { size: 3, first: true, listen: true, typo: 1 },
    A2: { size: 3, first: true, listen: true, typo: 1 },
    B1: { size: 4, first: false, listen: true, typo: 0 },
    B2: { size: 4, first: false, listen: false, typo: 0 },
    C1: { size: 4, first: false, listen: false, typo: 0 }
  };
  function dist(a, b) {
    const d = [...Array(b.length + 1)].map((_, j) => j);
    for (let i = 1; i <= a.length; i++) { let prev = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; } }
    return d[b.length];
  }

  function playBingo(view, src, modo) {
    const pool = src.words();
    const rules = G.BINGO_RULES[src.lv || E.currentLevel(P())] || G.BINGO_RULES.A1;
    const size = pool.length >= 24 ? rules.size : 3, n = size * size;
    const card = shuffle(pool.slice(0, Math.max(n, Math.min(pool.length, n + 10)))).slice(0, n);
    const onCard = new Set(card.map(w => w.id));
    const calls = shuffle(card); // passano solo le parole della cartella
    const marked = new Set(); const started = Date.now();
    let i = 0, ok = 0, answered = 0, busy = false; const misses = [];
    const lines = [];
    for (let r = 0; r < size; r++) { lines.push([...Array(size)].map((_, c) => r * size + c)); lines.push([...Array(size)].map((_, c) => c * size + r)); }
    lines.push([...Array(size)].map((_, k) => k * size + k)); lines.push([...Array(size)].map((_, k) => k * size + size - 1 - k));
    const hasBingo = () => lines.find(l => l.every(k => marked.has(card[k].id)));

    view.innerHTML = '<div class="session bingo"><div class="session-top"><a class="btn icon ghost" href="#/bingo?modo=' + modo + '" aria-label="Esci">' + icon('close') + '</a><div class="progress"><span style="width:0%"></span></div><span class="count small muted"></span></div>' +
      '<h2 class="session-title">Bingo · ' + esc(src.label) + '</h2>' +
      '<div class="bingo-wrap"><div class="card bingo-call"><div class="call-pic" aria-live="polite"></div><div class="call-ask"></div><div class="call-act"></div><div class="call-fb" aria-live="polite"></div></div>' +
      '<div class="bingo-card s' + size + '" role="grid" aria-label="La tua cartella">' + card.map((w, k) => '<button class="bcell" data-k="' + k + '" type="button"><span class="bw" lang="it">' + esc(w.it) + '</span><span class="bp" aria-hidden="true">' + w.pic + '</span></button>').join('') + '</div></div></div>';
    const $ = s => view.querySelector(s);
    const cells = [...view.querySelectorAll('.bcell')];

    function feedback(html, cls) { const f = $('.call-fb'); f.className = 'call-fb ' + (cls || ''); f.innerHTML = html; }
    function mark(w) { const k = card.indexOf(w); if (k >= 0) { marked.add(w.id); cells[k].classList.add('on'); } }
    function result(w, good, msg) {
      answered++; if (good) ok++; else misses.push(w.it);
      E.recordAnswer(P(), { skill: 'lessico', lv: w.level || 'A1' }, good, { logError: false });
      if (onCard.has(w.id)) mark(w);
      feedback(msg, good ? 'good' : 'bad'); say(w.it);
      busy = true;
      const line = hasBingo();
      if (line) { line.forEach(k => cells[k].classList.add('win')); return setTimeout(finish, 1400); }
      $('.call-act').innerHTML = '<button class="btn primary go" type="button">Avanti</button>';
      $('.call-act .go').addEventListener('click', next); $('.call-act .go').focus();
    }
    function next() {
      busy = false; feedback('');
      const w = calls[i++];
      if (!w) return finish();
      $('.progress span').style.width = Math.round(100 * (i - 1) / calls.length) + '%';
      $('.count').textContent = i + ' / ' + calls.length;
      $('.call-pic').textContent = w.pic;
      if (modo === 'riconosci') {
        $('.call-ask').textContent = 'Che cos\'è? Tocca la parola nella cartella.';
        $('.call-act').innerHTML = '<div class="row wrap center">' + (rules.listen ? '<button class="btn ghost small lis" type="button">' + icon('speaker') + ' Ascolta la parola</button>' : '') + '</div>';
        if (rules.listen) $('.call-act .lis').addEventListener('click', () => say(w.it));
        cells.forEach(c => { c.onclick = () => {
          if (busy) return; const t = card[+c.dataset.k];
          if (t.id === w.id) result(w, true, 'Bravo! <b lang="it">' + esc(w.it) + '</b>.');
          else { c.classList.add('shake'); setTimeout(() => c.classList.remove('shake'), 400); result(w, false, 'No, questa è <b lang="it">' + esc(w.it) + '</b>.'); }
        }; });
      } else {
        $('.call-ask').innerHTML = 'Scrivi la parola: <span class="hint-len">' + w.it.split('').map((ch, k) => ch === ' ' ? '&nbsp;&nbsp;' : rules.first && k === 0 ? esc(ch) : '_').join(' ') + '</span>';
        $('.call-act').innerHTML = '<form class="row wrap call-form"><input class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" lang="it" aria-label="La parola"><button class="btn primary" type="submit">Controlla</button><button class="btn ghost skip" type="button">Non lo so</button></form>';
        cells.forEach(c => { c.onclick = null; });
        const inp = $('.call-form input'); inp.focus();
        $('.call-form .skip').addEventListener('click', () => { if (!busy) result(w, false, 'La parola è <b lang="it">' + esc(w.it) + '</b>.'); });
        $('.call-form').addEventListener('submit', ev => {
          ev.preventDefault(); if (busy) return;
          const v = inp.value; if (!v.trim()) return inp.focus();
          const where = '';
          if (G.norm(v) === G.norm(w.it)) result(w, true, 'Giusto: <b lang="it">' + esc(w.it) + '</b>.' + where);
          else if (G.bare(v) === G.bare(w.it)) result(w, true, 'Quasi: si scrive <b lang="it">' + esc(w.it) + '</b>, con l\'accento.' + where);
          else if (rules.typo && w.it.length >= 4 && dist(G.bare(v), G.bare(w.it)) <= rules.typo) result(w, true, 'Quasi giusto: si scrive <b lang="it">' + esc(w.it) + '</b>.' + where);
          else result(w, false, 'Si scrive <b lang="it">' + esc(w.it) + '</b>.' + where);
        });
      }
    }
    function finish() {
      const bingo = !!hasBingo();
      const r = { correct: ok, total: answered, durationSec: Math.round((Date.now() - started) / 1000) };
      IL2.log({ type: 'game', ref: 'bingo:' + src.key, skill: 'lessico', correct: ok, total: answered, durationSec: r.durationSec, misses: misses.slice(0, 20) });
      const g = games(); g.bingo = { count: ((g.bingo && g.bingo.count) || 0) + 1, at: Date.now() };
      IL2.award(2 + ok); IL2.save();
      view.innerHTML = '<section class="result card"><div class="big-emoji" aria-hidden="true">' + (bingo ? '🎉' : '🙂') + '</div><h2>' + (bingo ? 'Bingo!' : 'Partita finita') + '</h2>' +
        '<p class="muted">' + ok + ' risposte giuste su ' + answered + '.</p>' +
        (misses.length ? '<p>Da ripassare: ' + [...new Set(misses)].map(m => '<b lang="it">' + esc(m) + '</b>').join(', ') + '</p>' : '') +
        '<div class="row center wrap"><a class="btn ghost" href="#/giochi">Giochi</a><a class="btn primary" href="#/bingo?da=' + encodeURIComponent(src.key) + '&modo=' + modo + '&n=' + Date.now() + '">Nuova cartella</a></div></section>';
    }
    next();
  }

  // ---------- Cruciverba ----------
  R.cruciverba = async function (view, parts) {
    if (parts[0]) return playCrossword(view, parts[0]);
    view.innerHTML = '<a class="back" href="#/giochi">' + icon('back') + 'Giochi</a><div class="page-head"><h1>Cruciverba</h1><p class="muted">Dal più facile al più difficile. Fino al B1 le definizioni sono frasi da completare e c\'è l\'elenco delle parole da inserire; al B2 e al C1 sono definizioni in italiano.</p></div>' +
      '<div class="theme-grid">' + G.CROSSWORDS.map((s, k) => {
        const d = games()[s.id];
        if (!open(s.level)) return '<div class="card theme locked"><span class="th-icon" aria-hidden="true">' + icon('lock') + '</span><b>' + (k + 1) + '. ' + esc(s.title) + '</b><small>' + G.DIFFICULTY[s.level] + ' · si sblocca al livello ' + s.level + '</small></div>';
        return '<a class="card theme lvl-' + s.level + '" href="#/cruciverba/' + s.id + '"><span class="th-icon cw-num" aria-hidden="true">' + (k + 1) + '</span><b>' + esc(s.title) + '</b><small>' + levelBadge(s.level) + ' ' + G.DIFFICULTY[s.level] + (d ? ' · ' + icon('check') + ' completato' : '') + '</small></a>';
      }).join('') + '</div>';
  };

  function playCrossword(view, id) {
    const cw = G.crossword(id);
    if (!cw) return IL2.go('cruciverba');
    if (!open(cw.level)) { view.innerHTML = '<a class="back" href="#/cruciverba">' + icon('back') + 'Cruciverba</a><section class="lock-panel">' + icon('lock', 'big') + '<div><h2>Si sblocca al livello ' + cw.level + '</h2></div></section>'; return; }
    const started = Date.now(); const helped = new Set(); let finished = false;
    const clueHtml = e => '<span lang="it">' + esc(e.clue.text) + '</span> <small class="muted">(' + e.answer.length + ')</small>';
    const bank = cw.bank ? '<div class="cw-bank"><h3>Parole da inserire</h3><ul>' + cw.entries.map(e => e.answer).sort((a, b) => a.localeCompare(b, 'it')).map(a => '<li data-a="' + a + '" lang="it">' + a + '</li>').join('') + '</ul></div>' : '';
    const list = dir => '<ol class="cw-list">' + cw.entries.filter(e => e.dir === dir).map(e => '<li data-e="' + cw.entries.indexOf(e) + '"><b>' + e.num + '</b> ' + clueHtml(e) + '</li>').join('') + '</ol>';
    let grid = '';
    for (let y = 0; y < cw.h; y++) for (let x = 0; x < cw.w; x++) {
      const key = x + ',' + y;
      if (!cw.grid[key]) { grid += '<div class="cw-cell blk"></div>'; continue; }
      const start = cw.entries.find(e => e.x === x && e.y === y);
      grid += '<div class="cw-cell">' + (start ? '<span class="cw-n">' + start.num + '</span>' : '') + '<input data-c="' + key + '" maxlength="2" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Casella ' + (x + 1) + ', riga ' + (y + 1) + '"></div>';
    }
    view.innerHTML = '<a class="back" href="#/cruciverba">' + icon('back') + 'Cruciverba</a><h1>' + esc(cw.title) + '</h1><p class="muted small">' + levelBadge(cw.level) + ' ' + G.DIFFICULTY[cw.level] + ' · ' + cw.entries.length + ' parole. Tocca una casella o una definizione; tocca di nuovo la casella per cambiare direzione.</p>' +
      '<div class="cw-wrap"><div class="cw-grid" style="--cols:' + cw.w + '">' + grid + '</div><div class="cw-clues card"><p class="cw-current" aria-live="polite"></p>' + bank + '<h3>Orizzontali</h3>' + list('a') + '<h3>Verticali</h3>' + list('d') + '</div></div>' +
      '<div class="row wrap cw-actions"><button class="btn primary" id="cw-check" type="button">' + icon('check') + ' Controlla</button><button class="btn ghost" id="cw-hint" type="button">' + icon('bulb') + ' Una lettera</button><button class="btn ghost" id="cw-sol" type="button">Mostra la soluzione</button></div>';
    const inputs = {}; view.querySelectorAll('.cw-grid input').forEach(i => { inputs[i.dataset.c] = i; });
    const cellsOf = e => [...Array(e.answer.length)].map((_, k) => (e.dir === 'a' ? e.x + k : e.x) + ',' + (e.dir === 'd' ? e.y + k : e.y));
    let cur = cw.entries[0], pos = cellsOf(cur)[0];
    function highlight() {
      view.querySelectorAll('.cw-cell.hl').forEach(c => c.classList.remove('hl'));
      view.querySelectorAll('.cw-list li.on').forEach(c => c.classList.remove('on'));
      cellsOf(cur).forEach(k => inputs[k].parentNode.classList.add('hl'));
      const li = view.querySelector('.cw-list li[data-e="' + cw.entries.indexOf(cur) + '"]'); if (li) li.classList.add('on');
      view.querySelector('.cw-current').innerHTML = '<b>' + cur.num + ' ' + (cur.dir === 'a' ? 'orizzontale' : 'verticale') + '</b> · ' + clueHtml(cur);
    }
    function focusCell(k) { pos = k; inputs[k].focus(); inputs[k].select(); }
    function entriesAt(k) { return cw.entries.filter(e => cellsOf(e).includes(k)); }
    function step(d) { const cs = cellsOf(cur); let j = cs.indexOf(pos) + d; while (j >= 0 && j < cs.length && inputs[cs[j]].readOnly) j += d; if (j >= 0 && j < cs.length) focusCell(cs[j]); }
    Object.entries(inputs).forEach(([k, inp]) => {
      inp.addEventListener('focus', () => { pos = k; if (!cellsOf(cur).includes(k)) { const es = entriesAt(k); cur = es.find(e => e.dir === cur.dir) || es[0]; } highlight(); });
      inp.addEventListener('mousedown', () => { if (pos === k && document.activeElement === inp) { const es = entriesAt(k); if (es.length > 1) { cur = es.find(e => e !== cur); highlight(); } } });
      inp.addEventListener('input', () => {
        const v = G.bare(inp.value).replace(/[^a-z]/g, ''); inp.value = v.slice(-1).toUpperCase();
        inp.parentNode.classList.remove('bad', 'ok');
        if (inp.value) step(1);
        checkDone();
      });
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Backspace' && !inp.value) { ev.preventDefault(); step(-1); const t = inputs[pos]; if (t) t.value = ''; }
        else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft' || ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
          ev.preventDefault(); const [x, y] = k.split(',').map(Number);
          const d = { ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
          const nk = (x + d[0]) + ',' + (y + d[1]); if (inputs[nk]) { const es = entriesAt(nk); cur = es.find(e => e.dir === (d[0] ? 'a' : 'd')) || es[0]; focusCell(nk); }
        }
      });
    });
    view.querySelectorAll('.cw-list li').forEach(li => li.addEventListener('click', () => { cur = cw.entries[+li.dataset.e]; const cs = cellsOf(cur); focusCell(cs.find(k => !inputs[k].value) || cs[0]); }));
    const right = k => inputs[k].value.toLowerCase() === cw.grid[k];
    function checkDone() { if (!finished && Object.keys(inputs).every(right)) finish(false); }
    view.querySelector('#cw-check').addEventListener('click', () => {
      let wrong = 0, empty = 0;
      Object.keys(inputs).forEach(k => { const c = inputs[k].parentNode; c.classList.remove('bad', 'ok'); if (!inputs[k].value) empty++; else if (right(k)) c.classList.add('ok'); else { c.classList.add('bad'); wrong++; } });
      if (!wrong && !empty) return finish(false);
      toast(wrong ? wrong + (wrong === 1 ? ' lettera sbagliata' : ' lettere sbagliate') + (empty ? ', ' + empty + ' caselle vuote' : '') : 'Tutto giusto finora! Mancano ' + empty + ' caselle.', wrong ? 'bad' : 'good');
    });
    view.querySelector('#cw-hint').addEventListener('click', () => {
      const k = !right(pos) ? pos : cellsOf(cur).find(c => !right(c)) || Object.keys(inputs).find(c => !right(c));
      if (!k) return;
      inputs[k].value = cw.grid[k].toUpperCase(); inputs[k].parentNode.classList.add('help'); helped.add(k); checkDone();
    });
    view.querySelector('#cw-sol').addEventListener('click', () => {
      if (!confirm('Vuoi vedere tutte le risposte?')) return;
      Object.keys(inputs).forEach(k => { if (!right(k)) { inputs[k].value = cw.grid[k].toUpperCase(); inputs[k].parentNode.classList.add('help'); helped.add(k); } });
      finish(true);
    });
    function finish(gaveUp) {
      finished = true;
      const solved = cw.entries.filter(e => cellsOf(e).every(k => !helped.has(k))).length;
      const r = { correct: solved, total: cw.entries.length, durationSec: Math.round((Date.now() - started) / 1000) };
      IL2.log({ type: 'game', ref: 'cruciverba:' + cw.id, skill: 'lessico', correct: solved, total: cw.entries.length, durationSec: r.durationSec });
      cw.entries.forEach(e => E.recordAnswer(P(), { skill: 'lessico', lv: cw.level }, cellsOf(e).every(k => !helped.has(k)), { logError: false }));
      if (!gaveUp) { const g = games(); g[cw.id] = { at: Date.now(), solved, total: cw.entries.length }; IL2.award(3 + solved); }
      IL2.save();
      view.querySelectorAll('.cw-grid input').forEach(i => { i.readOnly = true; });
      const box = document.createElement('section'); box.className = 'result card';

(function () {

  const topicName = t => C.topics[t] ? C.topics[t].name : 'Altro';
  const itemText = it => (it.q || it.say || it.prompt || (it.words ? it.words.join(' / ') : '') || '').slice(0, 140);
  function answerOf(it) {
    if (it.t === 'mc') return it.o[it.a];

  // ---------- Indicatori calcolati sui dati di uno studente ----------
  function accuracyBetween(acts, from, to) {
    let n = 0, ok = 0;

  function metrics(s, p, acts) {

    const trend = acc7 == null || accPrev == null ? 0 : acc7 - accPrev > 0.05 ? 1 : accPrev - acc7 > 0.05 ? -1 : 0;
    const topics = Object.entries(p.topics || {}).filter(([t, v]) => v.n >= 3 && C.topics[t]).map(([t]) => ({ t, m: E.topicMastery(p, t) })).sort((a, b) => a.m - b.m);
    const weakest = topics.length && topics[0].m < 0.6 ? topics[0] : null;

    return { acc7, accPrev, trend, weakest, lp, inactive: !s.lastActivity || now - s.lastActivity > 7 * DAY };
  }
  const accTxt = v => v == null ? '—' : Math.round(v * 100) + '%';

    if (m.acc7 == null || m.accPrev == null) return '<span class="trend flat" title="Dati insufficienti">—</span>';

        '<div class="kpi">' + icon('target') + '<div><b>' + (accs.length ? Math.round(100 * accs.reduce((a, b) => a + b, 0) / accs.length) + '<small>%</small>' : '—') + '</b><span>precisione media (7 giorni)</span></div></div>' +

  function secProgress(s, p, m) {

      return '<div class="lv-prog' + (locked ? ' locked' : '') + '">' + levelBadge(lv) + '<div>' + meter(lp.done, lp.total, lp.pct >= 80 ? 'ok' : '') + '<small>' + (locked ? icon('lock') + ' bloccato · ' : '') + lp.done + ' lezioni su ' + lp.total + '</small></div></div>';
    }).join('');
    return '<div class="grid2"><div class="card"><h3>Livello nei test</h3>' + IL2.ui.levelLine(p.placement.map(x => ({ at: x.at, theta: x.theta, level: x.level }))) +
      '<div class="table-wrap"><table class="tbl small"><tr><th>Data</th><th>Tipo</th><th>Livello</th><th>Gramm.</th><th>Lessico</th><th>Lettura</th><th>Ascolto</th><th>Risposte</th></tr>' + (p.placement.slice().reverse().map(x => '<tr><td>' + fmtDate(x.at) + '</td><td>' + esc(x.kind || '') + '</td><td>' + levelBadge(x.level) + ' <small>' + esc(x.sublevel || '') + '</small></td>' + ['grammatica', 'lessico', 'lettura', 'ascolto'].map(k => '<td>' + (x.perSkill && x.perSkill[k] ? x.perSkill[k].level : '—') + '</td>').join('') + '<td>' + x.correct + '/' + x.items + '</td></tr>').join('') || '<tr><td colspan="8" class="muted">Nessun test.</td></tr>') + '</table></div>' +
      '<p class="small muted">Prossimo test: ' + testState(s) + (E.levelUpReady(p) ? ' · <b>ha completato almeno l\'80% delle lezioni del livello e può anticipare il test</b>' : '') + '</p></div>' +
      '<div class="card"><h3>Profilo delle abilità</h3>' + IL2.ui.radar(p.skills, { labels: E.SKILL_LABEL }) + '<div class="skillbars">' + E.SKILLS.map(k => '<div class="sb"><span>' + E.SKILL_LABEL[k] + '</span>' + meter(((p.skills[k] + 3) / 5.5) * 100, 100) + '<b>' + E.levelFromTheta(p.skills[k]) + '</b></div>').join('') + '</div><p class="small muted">Stima continua aggiornata da test e pratica.</p></div></div>' +
      '<div class="grid2"><div class="card"><h3>Lezioni completate per livello</h3><div class="lv-progs">' + levels + '</div><p class="small muted">Lo studente vede il proprio livello e quelli precedenti; i successivi si sbloccano con il test.</p></div>' +
      '<div class="card"><h3>Minuti di studio al giorno</h3>' + IL2.ui.minutesBars(p.timeLog, 21, (IL2.state.settings || {}).dailyGoalMinutes) + '<p class="small muted">Ultime tre settimane; la linea è l\'obiettivo giornaliero.</p></div></div>' +
      '<div class="card"><h3>Padronanza degli argomenti</h3>' + (topics.length ? '<div class="table-wrap"><table class="tbl small"><tr><th>Argomento</th><th>Liv.</th><th>Padronanza</th><th>Risposte giuste</th><th>Ultima pratica</th></tr>' + topics.map(x => '<tr><td>' + esc(C.topics[x.id].name) + '</td><td>' + C.topics[x.id].lv + '</td><td class="mcell">' + meter(Math.round(x.m * 100), 100, x.m >= 0.7 ? 'ok' : x.m < 0.45 ? 'bad' : '') + '<small>' + Math.round(x.m * 100) + '%</small></td><td>' + x.t.ok + '/' + x.t.n + '</td><td>' + (x.t.last ? ago(x.t.last) : '—') + '</td></tr>').join('') + '</table></div><p class="small muted">Dal più debole al più solido. La padronanza tiene conto della difficoltà degli esercizi rispetto al livello dell\'argomento.</p>' : '<p class="muted">Ancora pochi dati.</p>') + '</div>';
  }

  function secErrors(s, p, filter) {
    const all = (p.errors || []).filter(e => C.itemByUid[e.key]).slice().sort((a, b) => (a.resolved - b.resolved) || b.at - a.at);
    const inF = (e, k) => k === 'tutti' || (k === 'risolti' ? e.resolved : !e.resolved);
    const shown = all.filter(e => inF(e, filter));
    const byTopic = {};
    for (const e of all) { const k = e.topic || C.itemByUid[e.key].topic || 'altro'; const t = byTopic[k] = byTopic[k] || { open: 0, res: 0, times: 0 }; if (e.resolved) t.res++; else t.open++; t.times += e.count; }
    const topicRows = Object.entries(byTopic).sort((a, b) => b[1].open - a[1].open || b[1].times - a[1].times);
    const tips = topicRows.filter(([, v]) => v.open).map(([k]) => [k, IL2.l1.tip(s.l1, k)]).filter(x => x[1]).slice(0, 5);
    const src = e => { const base = e.key.split('#')[0]; return C.unitById[base] ? 'Lezione · ' + C.unitById[base].title : C.readingById[base] ? 'Lettura · ' + C.readingById[base].title : C.listeningById[base] ? 'Ascolto · ' + C.listeningById[base].title : ''; };
    return '<div class="grid2"><div class="card"><h3>Errori per argomento</h3>' + (topicRows.length ? '<div class="table-wrap"><table class="tbl small"><tr><th>Argomento</th><th>Aperti</th><th>Corretti</th><th>Volte sbagliato</th></tr>' + topicRows.map(([k, v]) => '<tr><td>' + esc(topicName(k)) + '</td><td>' + (v.open ? '<b class="bad-text">' + v.open + '</b>' : '0') + '</td><td>' + v.res + '</td><td>' + v.times + '</td></tr>').join('') + '</table></div>' : '<p class="muted">Nessun errore registrato.</p>') + '</div>' +
      '<div class="card"><h3>Possibili interferenze con la lingua d\'origine</h3>' + (tips.length ? '<p class="small muted">Note contrastive (' + esc(IL2.l1.name(s.l1)) + ') per gli argomenti con errori aperti. Le vedi solo tu.</p><ul class="small">' + tips.map(([k, t]) => '<li><b>' + esc(topicName(k)) + ':</b> ' + esc(t.it) + '</li>').join('') + '</ul>' : '<p class="muted small">Nessuna nota per gli errori attuali.</p>') + '</div></div>' +
      '<div class="card"><div class="row between wrap"><h3>Registro degli errori</h3><div class="seg">' + [['aperti', 'Aperti'], ['risolti', 'Corretti'], ['tutti', 'Tutti']].map(([k, l]) => '<a class="' + (k === filter ? 'on' : '') + '" href="#/studente/' + s.id + '?sez=errori&e=' + k + '">' + l + ' (' + all.filter(e => inF(e, k)).length + ')</a>').join('') + '</div></div>' +
      (shown.length ? '<div class="table-wrap"><table class="tbl small errlog"><tr><th>Esercizio</th><th>Argomento</th><th>Ha risposto</th><th>Risposta corretta</th><th>Volte</th><th>Ultima volta</th><th>Stato</th></tr>' + shown.map(e => { const it = C.itemByUid[e.key]; return '<tr><td>' + esc(itemText(it)) + '<br><small class="muted">' + esc(src(e)) + '</small></td><td>' + esc(topicName(e.topic || it.topic)) + '</td><td class="bad-text">' + esc(e.given || '—') + '</td><td class="good-text">' + esc(answerOf(it)) + '</td><td>' + e.count + '</td><td>' + fmtDate(e.at) + '</td><td>' + (e.resolved ? '<span class="tag good">corretto ' + fmtDate(e.resolvedAt) + '</span>' : e.streak ? '<span class="tag">1 risposta giusta su 2</span>' : '<span class="tag warn">aperto</span>') + '</td></tr>'; }).join('') + '</table></div>' : '<p class="muted">Nessun errore in questo elenco.</p>') +
      '<p class="small muted">Un errore si considera corretto quando lo studente risponde bene due volte di seguito, nel ripasso o rifacendo l\'esercizio.</p></div>';
  }

  const ACT_ICON = { unit: 'path', reading: 'read', listening: 'headphones', writing: 'pen', speaking: 'mic', vocab: 'dict', review: 'repeat', errors: 'wrench', topic: 'target', test: 'compass', mixed: 'repeat', game: 'puzzle' };
  function secActivity(s, p, d) {
    const acts = d.activity.slice(-60).reverse();
    const srs = Object.values(p.srs || {}), now = Date.now();
    const learned = srs.filter(c => c.box >= 3).length, due = srs.filter(c => c.due <= now).length;
    const themes = C.vocab.map(t => ({ t, n: t.words.filter(w => p.srs[w.id]).length, l: t.words.filter(w => p.srs[w.id] && p.srs[w.id].box >= 3).length })).filter(x => x.n);
    const counts = { unit: Object.keys(p.unitsDone || {}).length, reading: Object.keys(p.readingsDone || {}).length, listening: Object.keys(p.listeningsDone || {}).length, writing: d.submissions.length };
    return '<div class="grid2"><div class="card"><h3>Cosa ha fatto</h3><div class="mini-stats"><span>' + icon('path') + '<b>' + counts.unit + '</b> lezioni</span><span>' + icon('read') + '<b>' + counts.reading + '</b> letture</span><span>' + icon('headphones') + '<b>' + counts.listening + '</b> ascolti</span><span>' + icon('pen') + '<b>' + counts.writing + '</b> scritti</span></div>' +
      '<ul class="activity small">' + (acts.length ? acts.map(a => '<li>' + icon(ACT_ICON[a.type] || 'check') + '<span>' + esc(C.describe(a.type, a.ref) || a.type) + '</span><span class="muted">' + (a.total ? a.correct + '/' + a.total + ' · ' : '') + (a.durationSec ? Math.max(1, Math.round(a.durationSec / 60)) + ' min · ' : '') + fmtDate(a.at, true) + '</span></li>').join('') : '<li class="muted">Nessuna attività.</li>') + '</ul></div>' +
      '<div class="card"><h3>Lessico</h3><div class="mini-stats"><span><b>' + srs.length + '</b> parole incontrate</span><span><b>' + learned + '</b> memorizzate</span><span><b>' + due + '</b> da ripassare</span></div>' +
      (themes.length ? '<div class="table-wrap"><table class="tbl small"><tr><th>Tema</th><th>Liv.</th><th>Memorizzate</th></tr>' + themes.map(x => '<tr><td>' + esc(x.t.title) + '</td><td>' + x.t.level + '</td><td class="mcell">' + meter(x.l, x.t.words.length, x.l === x.t.words.length ? 'ok' : '') + '<small>' + x.l + '/' + x.t.words.length + '</small></td></tr>').join('') + '</table></div>' : '<p class="muted small">Non ha ancora iniziato il lessico.</p>') + '</div></div>';
  }

  function secWritings(s, d) {
    return '<div class="grid2"><div class="card"><h3>Scritti</h3>' + (d.submissions.length ? '<ul class="list">' + d.submissions.map(x => '<li><a class="row-item" href="#/scritto/' + x.id + '">' + icon('pen') + '<span><b>' + esc(x.title) + '</b><small>' + fmtDate(x.at) + (x.autoFeedback && x.autoFeedback.stats ? ' · ' + x.autoFeedback.stats.words + ' parole' : '') + '</small></span><span class="tag ' + (x.status === 'corretto' ? 'good' : 'warn') + '">' + (x.status === 'corretto' ? 'commentato' : 'da leggere') + '</span></a></li>').join('') + '</ul>' : '<p class="muted small">Nessuno scritto inviato.</p>') + '</div>' +
      '<div class="card"><h3>Note dell\'insegnante</h3><textarea id="note" rows="6" placeholder="Osservazioni, bisogni, PDP/PEI, contatti con la famiglia… (visibili solo a te)">' + esc(d.note) + '</textarea><button class="btn small" id="savenote">Salva nota</button></div></div>' +
      '<details class="card danger-zone"><summary>Azioni avanzate</summary><p class="small">Esporta tutti i dati dello studente (ad esempio per una richiesta della famiglia), azzera i progressi (ricomincia dal test iniziale) o elimina definitivamente lo studente e tutti i suoi dati.</p><div class="row wrap"><button class="btn ghost" id="exp">Esporta i suoi dati</button><button class="btn warn" id="reset">Azzera progressi</button><button class="btn danger" id="del">Elimina studente</button></div></details>';
  }
  function bindNotes(view, s, d) {
    view.querySelector('#savenote').addEventListener('click', async () => { await IL2.api.call('saveNote', { id: s.id, text: view.querySelector('#note').value }); toast('Nota salvata', 'good'); });
    view.querySelector('#exp').addEventListener('click', () => download('dati-' + s.username + '-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ esportato: new Date().toISOString(), studente: s, profilo: d.profile, scritti: d.submissions || [], attivita: d.activity || [], nota: d.note || '' }, null, 2)));
    view.querySelector('#reset').addEventListener('click', async () => { if (await confirm('Azzerare tutti i progressi di ' + s.displayName + '? Scritti e note restano.', 'Azzera', true)) { await IL2.api.call('resetStudentProgress', { id: s.id }); toast('Progressi azzerati'); IL2.go('studente/' + s.id); } });
    view.querySelector('#del').addEventListener('click', async () => { if (await confirm('Eliminare definitivamente ' + s.displayName + ' e tutti i suoi dati? L\'operazione non si può annullare.', 'Elimina', true)) { await IL2.api.call('deleteStudent', { id: s.id }); toast('Studente eliminato'); IL2.go('panoramica'); } });
  }

  function printReport(view, d) {
    const s = d.summary, p = d.profile; const st = IL2.state.settings;
    const last = p.placement[p.placement.length - 1];
    const topics = Object.entries(p.topics).map(([id, t]) => ({ id, m: E.topicMastery(p, id), n: t.n })).filter(x => x.m !== null && C.topics[x.id] && x.n >= 3);
    const strong = topics.filter(x => x.m >= 0.7).sort((a, b) => b.m - a.m).slice(0, 6), weak = topics.filter(x => x.m < 0.5).sort((a, b) => a.m - b.m).slice(0, 6);
    const totalMin = Math.round(Object.values(p.timeLog).reduce((a, b) => a + b, 0) / 60);
    const shownLv = E.LEVELS.filter((l, i) => i <= E.LEVELS.indexOf(s.level));
    view.innerHTML = '<div class="no-print row"><a class="btn ghost" href="#/studente/' + s.id + '">' + icon('back') + ' Torna alla scheda</a><button class="btn primary" data-print>Stampa / Salva PDF</button></div>' +
      '<article class="report"><header><h1>Scheda di rilevazione delle competenze in italiano L2</h1><p>' + esc(st.schoolName) + ' · data: ' + fmtDate(Date.now()) + '</p></header>' +
      '<table class="tbl"><tr><th>Studente</th><td>' + esc(s.displayName) + '</td><th>Lingua d\'origine</th><td>' + esc(IL2.l1.name(s.l1)) + '</td></tr><tr><th>Gruppo</th><td>' + esc(s.group || '—') + '</td><th>In piattaforma dal</th><td>' + fmtDate(s.createdAt) + '</td></tr></table>' +
      '<h2>Livello QCER rilevato: ' + esc(s.level || '—') + (last ? ' (' + esc(last.sublevel || '') + ')' : '') + '</h2><p>' + esc(E.LEVEL_DESC[s.level] || '') + '</p>' +
      '<h3>Storico dei test di livello</h3><table class="tbl"><tr><th>Data</th><th>Tipo</th><th>Livello</th><th>Grammatica</th><th>Lessico</th><th>Lettura</th><th>Ascolto</th></tr>' + p.placement.map(x => '<tr><td>' + fmtDate(x.at) + '</td><td>' + esc(x.kind) + '</td><td>' + x.level + '</td>' + ['grammatica', 'lessico', 'lettura', 'ascolto'].map(k => '<td>' + (x.perSkill && x.perSkill[k] ? x.perSkill[k].level : '—') + '</td>').join('') + '</tr>').join('') + '</table>' +
      '<h3>Profilo per abilità (stima attuale)</h3><table class="tbl"><tr>' + E.SKILLS.map(k => '<th>' + E.SKILL_LABEL[k] + '</th>').join('') + '</tr><tr>' + E.SKILLS.map(k => '<td>' + E.levelFromTheta(p.skills[k]) + '</td>').join('') + '</tr></table>' +
      (shownLv.length ? '<h3>Lezioni completate</h3><table class="tbl"><tr>' + shownLv.map(l => '<th>' + l + '</th>').join('') + '</tr><tr>' + shownLv.map(l => { const lp = E.levelProgress(p, l); return '<td>' + lp.done + ' su ' + lp.total + '</td>'; }).join('') + '</tr></table>' : '') +
      '<div class="grid2"><div><h3>Punti di forza</h3><ul>' + (strong.map(x => '<li>' + esc(C.topics[x.id].name) + '</li>').join('') || '<li>—</li>') + '</ul></div><div><h3>Aspetti da consolidare</h3><ul>' + (weak.map(x => '<li>' + esc(C.topics[x.id].name) + '</li>').join('') || '<li>—</li>') + '</ul></div></div>' +
      '<h3>Impegno</h3><p>Tempo totale di studio registrato: ' + totalMin + ' minuti · lezioni completate: ' + Object.keys(p.unitsDone).length + ' · parole memorizzate: ' + Object.values(p.srs).filter(c => c.box >= 3).length + ' · testi letti: ' + Object.keys(p.readingsDone).length + ' · ascolti: ' + Object.keys(p.listeningsDone).length + ' · scritti inviati: ' + d.submissions.length + '.</p>' +
      '<h3>Osservazioni dell\'insegnante</h3><div class="notebox">' + esc(d.note || '').replace(/\n/g, '<br>') + '</div>' +
      '<p class="small muted">I livelli sono stimati da un test adattivo e dalla pratica sulla piattaforma con riferimento ai descrittori del QCER; integrano, non sostituiscono, l\'osservazione dell\'insegnante e le certificazioni ufficiali (CILS, CELI, PLIDA, CERT.IT).</p>' +
      '<div class="sign"><span>Data ____________</span><span>Firma del docente ______________________</span></div></article>';
  }

  // =================== STUDENTI (account) ===================
  R.studenti = async function (view) {
    const list = await IL2.api.call('listStudents');
    const groups = Array.from(new Set(list.map(s => s.group).filter(Boolean))).sort();
    const remote = window.IL2_SITE === 'insegnante';
    view.innerHTML = head('Studenti', remote ? 'Crea gli studenti e manda a ognuno il suo link di invito. Loro ti mandano i progressi, tu li importi qui.' : 'Crea gli account e consegna a ogni studente il suo codice di accesso.') +
      (remote ? '<div class="card highlight"><h3>' + icon('upload') + ' Importa i progressi</h3><p class="small">Scegli i file che ti hanno mandato gli studenti (anche più di uno insieme). Puoi importare lo stesso file due volte: i dati non si duplicano.</p>' +
        '<label class="btn primary">Scegli i file<input type="file" id="impprog" accept=".txt,.json,text/plain,application/json" multiple hidden></label><div id="impres"></div></div>' : '') +
      '<div class="card"><h3>Aggiungi uno studente</h3><form id="add" class="grid-form">' +
      '<label>Nome e cognome<input name="displayName" required maxlength="60" placeholder="Es. Amina B."></label>' +
      '<label>Nome utente <small class="muted">(per l\'accesso)</small><input name="username" maxlength="30" placeholder="automatico" autocapitalize="off"></label>' +
      '<label>Lingua d\'origine <small class="muted">(per il dizionario)</small><select name="l1">' + l1Options('ar') + '</select></label>' +
      '<label>Gruppo <small class="muted">(facoltativo)</small><input name="group" list="groups" maxlength="40" placeholder="Es. 2B"><datalist id="groups">' + groups.map(g => '<option>' + esc(g) + '</option>').join('') + '</datalist></label>' +
      '<label>Anno di nascita<input name="birthYear" type="number" min="1990" max="2025"></label>' +
      '<label>Codice segreto<input name="secret" value="' + genPin() + '" required minlength="4" maxlength="32"></label>' +
      '<button class="btn primary">Aggiungi</button></form>' +
      '<details><summary>Aggiungi più studenti insieme</summary><p class="small">Una riga per studente: <code>Nome; lingua; gruppo</code>. Lingue: ' + IL2.l1.ORDER.join(', ') + ', other. Esempio: <code>Yasmine El Idrissi; ar; 2B</code></p><textarea id="bulk" rows="5"></textarea><button class="btn" id="bulkgo">Crea tutti</button></details></div>' +
      '<div id="creds"></div>' +
      '<div class="card table-wrap"><table class="tbl"><thead><tr><th>Studente</th><th>Utente</th><th>Lingua d\'origine</th><th>Gruppo</th><th>Livello</th><th>Iscritto</th>' + (remote ? '<th>Ultimi progressi</th><th>Invito</th>' : '') + '</tr></thead><tbody>' +
      list.sort((a, b) => a.displayName.localeCompare(b.displayName)).map(s => '<tr><td><a href="#/studente/' + s.id + '">' + esc(s.displayName) + '</a></td><td><code>' + esc(s.username) + '</code></td><td>' + esc(IL2.l1.name(s.l1)) + '</td><td>' + esc(s.group) + '</td><td>' + levelBadge(s.level) + '</td><td>' + fmtDate(s.createdAt) + '</td>' + (remote ? '<td>' + (s.lastActivity ? ago(s.lastActivity) : '—') + '</td><td><button class="btn small" data-invite="' + s.id + '">' + icon('link') + ' Link</button></td>' : '') + '</tr>').join('') +
      '</tbody></table>' + (list.length ? '' : '<p class="muted">Nessuno studente.</p>') + '</div>';
    const created = [];
    function showCreds() {
      view.querySelector('#creds').innerHTML = created.length ? '<div class="card"><div class="row between"><h3>Credenziali appena create</h3><button class="btn ghost small" id="printc">Stampa i biglietti</button></div><p class="small muted">Consegna a ogni studente il suo biglietto. I codici non sono salvati in chiaro: se si perdono, generane uno nuovo dalla scheda dello studente.</p><div class="cred-grid">' + created.map(c => '<div class="cred"><b>' + esc(c.name) + '</b><div>Utente: <code>' + esc(c.username) + '</code></div><div>Codice: <code>' + esc(c.pin) + '</code></div><small>' + esc(remote ? 'Riceverai il link di invito' : location.origin + location.pathname) + '</small></div>').join('') + '</div></div>' : '';
      const pc = view.querySelector('#printc'); if (pc) pc.addEventListener('click', () => { document.body.classList.add('print-creds'); IL2.ui.print(); setTimeout(() => document.body.classList.remove('print-creds'), 500); });
    }
    if (remote) {
      view.querySelectorAll('[data-invite]').forEach(b => b.addEventListener('click', () => showInvite(b.dataset.invite)));
      view.querySelector('#impprog').addEventListener('change', async e => {
        const files = Array.from(e.target.files || []); e.target.value = '';
        const lines = [];
        for (const file of files) {
          try {
            const r = await IL2.api.call('importProgress', { data: JSON.parse(await file.text()) });
            lines.push('<li>' + icon('check') + ' <b>' + esc(r.student) + '</b>: progressi del ' + fmtDate(r.sentAt, true) + (r.activityAdded ? ', ' + r.activityAdded + (r.activityAdded === 1 ? ' attività nuova' : ' attività nuove') : ', nessuna attività nuova') + (r.newWritings ? ', ' + r.newWritings + (r.newWritings === 1 ? ' testo da leggere' : ' testi da leggere') : '') + '</li>');
          } catch (err) { lines.push('<li class="bad-text">' + esc(file.name) + ': ' + esc(err instanceof SyntaxError ? 'non è un file di progressi' : err.message) + '</li>'); }
        }
        await R.studenti(view);
        view.querySelector('#impres').innerHTML = '<ul class="plain">' + lines.join('') + '</ul>';
      });
    }
    view.querySelector('#add').addEventListener('submit', async e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
      try {
        const u = await IL2.api.call('createStudent', f);
        created.push({ name: u.displayName, username: u.username, pin: f.secret });
        toast('Studente aggiunto: ' + u.username, 'good');
        e.target.reset(); e.target.secret.value = genPin(); showCreds();
        const tb = view.querySelector('tbody'); tb.insertAdjacentHTML('afterbegin', '<tr class="new"><td><a href="#/studente/' + u.id + '">' + esc(u.displayName) + '</a></td><td><code>' + esc(u.username) + '</code></td><td>' + esc(IL2.l1.name(u.l1)) + '</td><td>' + esc(u.group) + '</td><td>—</td><td>oggi</td>' + (remote ? '<td>—</td><td><button class="btn small" data-invite="' + u.id + '">' + icon('link') + ' Link</button></td>' : '') + '</tr>');
        const ib = tb.querySelector('[data-invite="' + u.id + '"]'); if (ib) ib.addEventListener('click', () => showInvite(u.id));
        tb.closest('.card').querySelectorAll(':scope > p.muted').forEach(x => x.remove());
      } catch (err) { toast(err.message, 'bad'); }
    });
    view.querySelector('#bulkgo').addEventListener('click', async () => {
      const lines = view.querySelector('#bulk').value.split('\n').map(l => l.trim()).filter(Boolean);
      let ok = 0;
      for (const line of lines) {
        const [name, l1, group] = line.split(/[;\t]/).map(x => (x || '').trim());
        if (!name) continue;
        const pin = genPin();
        let base = IL2.handlers.normUsername(name.split(' ')[0]) || 'studente', username = base, n = 1;
        for (let tries = 0; tries < 30; tries++) {
          try {
            const u = await IL2.api.call('createStudent', { displayName: name, username, l1: IL2.l1.ORDER.includes(l1) || l1 === 'other' ? l1 : 'other', group: group || '', secret: pin });
            created.push({ name: u.displayName, username: u.username, pin }); ok++; break;
          } catch (err) { if (err.status === 409) { n++; username = base + n; } else { toast(name + ': ' + err.message, 'bad'); break; } }
        }
      }
      toast(ok + ' studenti creati', 'good'); showCreds();
    });
  };
