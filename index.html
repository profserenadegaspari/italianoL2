<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Italiano L2</title>
<link rel="icon" href="logo.png">
<style>
  :root { --bg: #f6f4ef; --surface: #ffffff; --text: #1d2422; --muted: #5f6a66; --line: #e3dfd5; --primary: #0e7c6b; --on-primary: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--bg); color: var(--text); font-family: "Atkinson Hyperlegible", Verdana, Tahoma, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px 24px; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 22px; }
  h1 { margin: 16px 0 4px; font-size: 1.8rem; }
  .firma { margin: 0 0 28px; color: var(--muted); }
  a.btn { display: block; padding: 14px 18px; border-radius: 12px; background: var(--primary); color: var(--on-primary); font-size: 1.1rem; font-weight: 700; text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .nota { margin: 0; font-size: .95rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="">
  <h1>Italiano L2</h1>
  <p class="firma">di prof.ssa Serena De Gaspari</p>
  <p class="nota">Per cominciare apri il link personale che ti ha mandato la tua insegnante.</p>
</main>
</body>
</html>
