  --bg: #f6f4ef; --surface: #ffffff; --surface-2: #f1eee7; --text: #1d2422; --muted: #5f6a66; --line: #e3dfd5;
  --primary: #0e7c6b; --primary-2: #0a5f52; --primary-soft: #d8f1eb; --on-primary: #ffffff;
  --accent: #e8664a; --accent-soft: #fde5dd;
  --good: #158a45; --good-soft: #dcf5e4; --bad: #c0352b; --bad-soft: #fde3df; --warn: #b4610a; --warn-soft: #fff0d6; --info-soft: #e2efff;
  --a1: #1f9d55; --a2: #0f8f86; --b1: #2f6fdb; --b2: #7a4fd6; --c1: #c93a62;
  --c-write: #7a4fd6; --c-listen: #2f6fdb; --c-speak: #e8664a; --c-read: #0f8f86; --c-err: #c98a0b; --c-test: #3b4bc8; --c-study: #5b7f1f; --c-game: #c2417a;
  --radius: 18px; --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(30, 36, 34, .05), 0 6px 20px rgba(30, 36, 34, .06);
  --shadow-hi: 0 2px 4px rgba(30, 36, 34, .06), 0 14px 32px rgba(30, 36, 34, .12);
  --font: "Lexend", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Noto Sans Bengali", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121715; --surface: #1b2220; --surface-2: #232c29; --text: #e8edeb; --muted: #9fada7; --line: #2f3a36;
    --primary: #3fd0b5; --primary-2: #7ae3cf; --primary-soft: #143e37; --on-primary: #05231d;
    --accent: #ff8a70; --accent-soft: #3d2019;
    --good: #5ad98b; --good-soft: #15331f; --bad: #ff7b6e; --bad-soft: #3d1a17; --warn: #fbbf4a; --warn-soft: #3a2c0d; --info-soft: #132a44;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); --shadow-hi: 0 14px 32px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121715; --surface: #1b2220; --surface-2: #232c29; --text: #e8edeb; --muted: #9fada7; --line: #2f3a36;
  --primary: #3fd0b5; --primary-2: #7ae3cf; --primary-soft: #143e37; --on-primary: #05231d;
  --accent: #ff8a70; --accent-soft: #3d2019;
  --good: #5ad98b; --good-soft: #15331f; --bad: #ff7b6e; --bad-soft: #3d1a17; --warn: #fbbf4a; --warn-soft: #3a2c0d; --info-soft: #132a44;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); --shadow-hi: 0 14px 32px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
:root.contrast { --text: #000; --muted: #222; --line: #555; --bg: #fff; --surface: #fff; --surface-2: #f2f2f2; --primary: #004d40; }
@media (prefers-color-scheme: dark) { :root.contrast { --text: #fff; --muted: #ddd; --bg: #000; --surface: #000; --surface-2: #111; --line: #aaa; --primary: #7fffd4; } }
:root.dyslexia body { font-family: "Atkinson Hyperlegible", "OpenDyslexic", Verdana, Tahoma, sans-serif; letter-spacing: .03em; word-spacing: .12em; line-height: 1.75; }

* { box-sizing: border-box; }
html { font-size: calc(16px * var(--font-scale)); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.55; font-weight: 400; }
a { color: var(--primary); text-underline-offset: 2px; }
h1 { font-size: 1.7rem; margin: .2em 0 .4em; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 1.25rem; margin: 1.4em 0 .5em; font-weight: 700; }
h3 { font-size: 1.06rem; margin: 0 0 .6em; font-weight: 600; }
h4 { margin: 1em 0 .4em; font-size: .95rem; }
b, strong { font-weight: 600; }
h1:focus, h2:focus { outline: none; }
code { background: var(--surface-2); padding: 0 .35em; border-radius: 5px; font-size: .9em; }
.muted { color: var(--muted); } .small { font-size: .86rem; } .center { text-align: center; } .block { display: block; }
.ok-text, .good-text { color: var(--good); } .bad-text { color: var(--bad); } .warn-text { color: var(--warn); }
.pre { white-space: pre-wrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -.25em; }
.ic.big { width: 48px; height: 48px; }
.eyebrow { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
.page-head { margin: 4px 0 14px; }
.page-head h1 { margin: 0 0 .15em; }
.page-head p { margin: 0; }

/* --- Logo: puzzle tricolore con il libro --- */
.logo { display: block; width: 36px; height: 36px; flex: none; }
.logo.big { width: 76px; height: 76px; margin: 0 auto; }

/* --- Struttura --- */
header.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--text); min-width: 0; }
.brand b { font-weight: 700; }
.brand small { display: block; color: var(--muted); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
header.top .who { display: flex; gap: 8px; align-items: center; } header.top .who .name { font-weight: 600; max-width: 28vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mode-banner { background: var(--warn-soft); color: var(--text); font-size: .8rem; padding: 6px 16px; text-align: center; }
.layout { display: flex; max-width: 1200px; margin: 0 auto; }
.nav { width: 220px; flex: none; padding: 18px 10px; position: sticky; top: 62px; align-self: flex-start; display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 14px; color: var(--muted); text-decoration: none; font-weight: 500; transition: background .15s, color .15s; }
.nav a .ic { width: 22px; height: 22px; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--primary); color: var(--on-primary); font-weight: 600; box-shadow: 0 6px 16px color-mix(in srgb, var(--primary) 30%, transparent); }
.view { flex: 1; min-width: 0; padding: 18px 24px 96px; }
.loading { padding: 40px; text-align: center; color: var(--muted); }
@media (max-width: 760px) {
  .nav { position: fixed; bottom: 0; left: 0; right: 0; top: auto; width: auto; z-index: 30; flex-direction: row; justify-content: space-around; gap: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); overflow-x: auto; box-shadow: 0 -4px 16px rgba(0,0,0,.05); }
  .nav a { flex-direction: column; gap: 2px; font-size: .68rem; padding: 6px 6px; min-width: 56px; text-align: center; border-radius: 12px; }
  .nav a.active { background: var(--primary-soft); color: var(--primary-2); box-shadow: none; }
  .view { padding: 12px 16px 100px; }
  header.top .who .name { display: none; }
  header.top { padding: 8px 16px; }
  h1 { font-size: 1.4rem; }
}

/* --- Componenti --- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin: 0 0 14px; box-shadow: var(--shadow); }
a:where(.card) { display: block; color: inherit; text-decoration: none; transition: transform .15s, box-shadow .15s, border-color .15s; }
a.card:hover { border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); box-shadow: var(--shadow-hi); transform: translateY(-2px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; min-height: 44px; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--primary); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 28%, transparent); }
.btn.primary:hover { background: var(--primary-2); border-color: var(--primary-2); }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.warn { background: var(--warn-soft); border-color: var(--warn); }
.btn.good { background: var(--good-soft); border-color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); }
.btn.big { padding: 14px 24px; font-size: 1.05rem; width: 100%; max-width: 420px; border-radius: 14px; }
.btn.small { padding: 5px 12px; min-height: 34px; font-size: .85rem; border-radius: 10px; }
.btn.icon { padding: 6px 10px; min-height: 40px; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
.row.end { justify-content: flex-end; } .row.center { justify-content: center; } .row.between { justify-content: space-between; } .row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .92rem; }
label input, label textarea, label select { font-weight: 400; }
label.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 500; }
input, select, textarea { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); min-height: 44px; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px var(--primary-soft); }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; min-height: 0; accent-color: var(--primary); flex: none; }
.row input, .row select { width: auto; flex: 1 1 160px; }
.row > select { width: auto; min-width: 150px; flex: 0 1 auto; }
textarea { resize: vertical; line-height: 1.5; }
fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; } legend { font-weight: 600; padding: 0 6px; }
.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: end; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.grid2 > .card { margin: 0 0 14px; }
.tbl-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
.tbl-scroll > table { min-width: 100%; }
.tag { display: inline-block; font-size: .74rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); vertical-align: middle; white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.lvl-A1 { --lv: var(--a1); } .lvl-A2 { --lv: var(--a2); } .lvl-B1 { --lv: var(--b1); } .lvl-B2 { --lv: var(--b2); } .lvl-C1 { --lv: var(--c1); }
.lvl { display: inline-block; font-weight: 700; color: #fff; padding: 2px 10px; border-radius: 8px; background: var(--lv, var(--muted)); font-size: .88rem; vertical-align: middle; letter-spacing: .02em; }
.lvl small { font-weight: 500; opacity: .9; }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 6px 0; min-width: 60px; }
.meter span { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .6s ease; }
.meter.ok span { background: var(--good); } .meter.bad span { background: var(--bad); }
.back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 8px; text-decoration: none; font-weight: 600; font-size: .92rem; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 12px 0 16px; padding: 2px 2px 4px; scrollbar-width: thin; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); text-decoration: none; color: var(--text); font-weight: 600; white-space: nowrap; font-size: .92rem; }
.tab:hover { border-color: var(--primary); }
.tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab.locked { color: var(--muted); background: var(--surface-2); border-style: dashed; }
.tab.locked.on { background: var(--muted); color: var(--surface); border-style: solid; border-color: var(--muted); }
.tab .ic { width: 1em; height: 1em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.chip { display: inline-block; padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font: inherit; font-size: .9rem; color: var(--text); cursor: pointer; text-decoration: none; }
.chip.small { padding: 2px 8px; font-size: .82rem; }
.chip.on { background: var(--primary-soft); border-color: var(--primary); }
.chip.ghost { opacity: .3; cursor: default; }
.chip.link:hover, .chip:hover { border-color: var(--primary); }
.divider { text-align: center; margin: 16px 0; color: var(--muted); font-size: .85rem; position: relative; }
.divider::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
.divider span { position: relative; background: var(--surface); padding: 0 10px; }
.empty-state { text-align: center; padding: 30px 18px; }
.empty-state .ic.big { color: var(--primary); margin-bottom: 6px; }
.note { background: var(--info-soft); border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; font-size: .92rem; }
.search { flex-direction: row; align-items: center; gap: 0; position: relative; flex: 1 1 240px; font-weight: 400; }
.search .ic { position: absolute; left: 14px; color: var(--muted); pointer-events: none; }
.search input { padding-left: 44px; border-radius: 999px; }
details > summary { cursor: pointer; font-weight: 600; }
details.card > summary { list-style-position: outside; }

/* --- Anelli di avanzamento --- */
.ring { position: relative; width: 88px; height: 88px; flex: none; color: var(--primary); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; }
.ring .ring-bg { stroke: var(--surface-2); }
.ring .ring-fg { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .9s cubic-bezier(.3, .7, .3, 1); }
.ring-txt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.1; }
.ring-txt b { font-size: 1.25rem; font-weight: 700; color: var(--text); }
.ring-txt small { font-size: .62rem; color: var(--muted); max-width: 70px; }
.ring.good { color: var(--good); } .ring.low { color: var(--bad); }
.ring.sm { width: 66px; height: 66px; } .ring.sm .ring-txt b { font-size: .95rem; } .ring.sm .ring-txt small { font-size: .56rem; }
.result .ring { width: 130px; height: 130px; margin: 0 auto 8px; } .result .ring-txt b { font-size: 1.9rem; } .result .ring-txt small { font-size: .7rem; max-width: 90px; }

/* --- Accesso --- */
.auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(circle at 15% 10%, var(--primary-soft), transparent 45%), radial-gradient(circle at 90% 90%, var(--accent-soft), transparent 40%), var(--bg); }
.auth-card { width: 100%; max-width: 440px; padding: 26px; }
.auth-head { text-align: center; margin-bottom: 16px; } .auth-head h1 { margin: .35em 0 .1em; }
.firma { margin: 0 0 .4em; color: var(--muted); font-size: .9rem; font-style: italic; }
.auth .btn.big { max-width: none; }
.demo-hint { margin-top: 14px; padding: 10px; border-radius: 12px; background: var(--info-soft); font-size: .86rem; text-align: center; }

/* --- Studente: Oggi --- */
.hero { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; padding: 24px; margin-bottom: 16px; border-radius: 24px; color: #fff; background: linear-gradient(135deg, #0e7c6b 0%, #0b5d6e 60%, #23457a 100%); box-shadow: 0 12px 30px rgba(14, 124, 107, .25); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255, 255, 255, .07); pointer-events: none; }
.hero h1 { color: #fff; margin: .15em 0 .2em; font-size: 1.8rem; }
.hero p { margin: 0; opacity: .92; }
.hero .eyebrow { color: rgba(255, 255, 255, .78); }
.hero-text { flex: 1 1 260px; position: relative; z-index: 1; }
.hero-stats { display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 1; }
.hs { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 104px; padding: 10px 12px; border-radius: 18px; background: rgba(255, 255, 255, .13); color: #fff; text-decoration: none; }
a.hs:hover { background: rgba(255, 255, 255, .2); }
.hs > span { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.hero .ring { color: #fff; width: 76px; height: 76px; }
.hero .ring .ring-bg { stroke: rgba(255, 255, 255, .2); }
.hero .ring-txt b { color: #fff; } .hero .ring-txt small { color: rgba(255, 255, 255, .8); }
.hero .ring.good { color: #9ff0bd; }
.hs.streak b { font-size: 1.8rem; line-height: 1; font-weight: 700; }
.hs .flame { width: 30px; height: 30px; color: #ffc46b; }
.banner { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin: 0 0 12px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--text); text-decoration: none; }
.banner > .ic:first-child { width: 42px; height: 42px; padding: 9px; border-radius: 14px; background: var(--primary-soft); color: var(--primary); }
.banner span { flex: 1; display: flex; flex-direction: column; }
.banner small { color: var(--muted); }
.banner > .ic:last-child { color: var(--muted); }
.banner.test { background: var(--info-soft); border-color: transparent; } .banner.test > .ic:first-child { background: var(--c-test); color: #fff; }
.banner.up { background: var(--accent-soft); border-color: transparent; } .banner.up > .ic:first-child { background: var(--accent); color: #fff; }
.banner.good > .ic:first-child { background: var(--good-soft); color: var(--good); }
a.banner:hover { box-shadow: var(--shadow-hi); }
.plan-sec { margin: 22px 0 8px; }
.sec-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.sec-head h2 { margin: 0; } .sec-head p { margin: 0; font-size: .9rem; }
.sec-ic { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; flex: none; }
.sec-ic .ic { width: 24px; height: 24px; }
.sec-ic.review { background: var(--warn-soft); color: var(--c-err); }
.sec-ic.new { background: color-mix(in srgb, var(--c-write) 15%, var(--surface)); color: var(--c-write); }
.review-card { display: flex !important; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.review-card.empty { display: block !important; }
.review-card.empty p { display: flex; gap: 8px; align-items: center; margin: 0 0 8px; }
.review-card.empty .ic { color: var(--good); }
.rc-counts { display: flex; gap: 22px; }
.rc-counts div { display: flex; flex-direction: column; }
.rc-counts b { font-size: 2rem; font-weight: 700; line-height: 1; color: var(--c-err); }
.rc-counts span { color: var(--muted); font-size: .85rem; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.choice { position: relative; display: flex !important; flex-direction: column; gap: 4px; padding: 18px; margin: 0; overflow: hidden; border-top: 4px solid var(--c, var(--primary)); }
.choice .ch-ic { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; margin-bottom: 8px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--c); }
.choice .ch-ic .ic { width: 26px; height: 26px; }
.choice .ch-kind { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
.choice b { font-size: 1.05rem; line-height: 1.3; }
.choice small { color: var(--muted); }
.choice .ch-go { position: absolute; top: 18px; right: 14px; color: var(--muted); }
.c-write { --c: var(--c-write); } .c-listen { --c: var(--c-listen); } .c-speak { --c: var(--c-speak); } .c-read { --c: var(--c-read); } .c-err { --c: var(--c-err); } .c-test { --c: var(--c-test); } .c-study { --c: var(--c-study); } .c-game { --c: var(--c-game); }

/* --- Studente: Lezioni --- */
.level-card { position: relative; padding: 20px 22px; border-radius: 22px; margin-bottom: 14px; color: #fff; background: linear-gradient(135deg, var(--lv, var(--primary)), color-mix(in srgb, var(--lv, var(--primary)) 65%, #0d1b2a)); box-shadow: 0 10px 26px color-mix(in srgb, var(--lv, var(--primary)) 30%, transparent); }
.level-card > div:first-child { display: flex; align-items: baseline; gap: 12px; }
.level-card .lv-big { font-size: 2.4rem; font-weight: 800; line-height: 1; }
.level-card b { font-size: 1.1rem; }
.level-card p { margin: 8px 0 6px; opacity: .92; }
.level-card .meter { background: rgba(255, 255, 255, .25); max-width: 360px; }
.level-card .meter span { background: #fff; }
.level-card small { opacity: .9; }
.map { list-style: none; padding: 0; margin: 0 0 10px; position: relative; }

@media (max-width: 760px) { .sticky-actions { bottom: 66px; } }
.level-desc { background: var(--surface-2); padding: 10px 12px; border-radius: var(--radius-sm); }
.theory { line-height: 1.7; }
.theory table { border-collapse: collapse; margin: 10px 0; width: 100%; font-size: .93rem; display: block; overflow-x: auto; }
.theory th, .theory td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; }
.theory th { background: var(--surface-2); font-weight: 600; }

/* --- Studente: Parole e dizionario --- */

.word-stats .btn { margin-left: auto; }
.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.theme { display: flex !important; flex-direction: column; gap: 2px; margin: 0; }

.banner.study > .ic:first-child { background: color-mix(in srgb, var(--c-study) 14%, transparent); color: var(--c-study); }
.wordlist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.wordlist.compact { grid-template-columns: 1fr; gap: 6px; }
.word { margin: 0; padding: 12px 14px; }
.w-main { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }

.box { margin-left: auto; color: var(--primary); font-size: .7rem; letter-spacing: 1px; }

.flash .w { font-size: 2.1rem; font-weight: 700; } .flash .g { font-size: 1.3rem; } .flash .ex { color: var(--muted); }
.flash .back { display: block; border-top: 1px dashed var(--line); padding-top: 12px; margin: 0; font-weight: 400; }
.grade-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 500px) { .grade-row { grid-template-columns: repeat(2, 1fr); } }

/* --- Studente: Pratica --- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tile { display: flex !important; flex-direction: column; align-items: flex-start; gap: 2px; position: relative; padding: 18px; margin: 0; }
.tile .t-icon { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 16px; margin-bottom: 10px; background: color-mix(in srgb, var(--c, var(--primary)) 14%, var(--surface)); color: var(--c, var(--primary)); }

.tile b { font-size: 1.05rem; } .tile small { color: var(--muted); }
.lvl-mini { position: absolute; top: 14px; right: 14px; font-size: .72rem; font-weight: 600; color: var(--muted); background: var(--surface-2); padding: 2px 8px; border-radius: 99px; }
.lv-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.list { display: grid; gap: 8px; list-style: none; padding: 0; margin: 0 0 12px; }
.row-item { display: flex !important; align-items: center; gap: 14px; padding: 12px 16px; margin: 0; color: var(--text); text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }

.row-item small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.row-item > .ic:last-child { color: var(--muted); }
.row-item.done .ri-ic { background: var(--good-soft); color: var(--good); }
.ri-state { font-size: .85rem; font-weight: 600; color: var(--good); white-space: nowrap; }
a.row-item:hover { border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); box-shadow: var(--shadow); }
.row-item .u-icon { font-size: 1.6rem; width: 40px; text-align: center; flex: none; }
.player { display: flex; align-items: center; gap: 18px; }

.play-btn { display: grid; place-items: center; width: 68px; height: 68px; border-radius: 50%; border: 0; flex: none; cursor: pointer; background: var(--c-listen); color: #fff; box-shadow: 0 8px 20px color-mix(in srgb, var(--c-listen) 35%, transparent); transition: transform .12s; }
.play-btn:hover { transform: scale(1.05); }

.passage { background: var(--surface-2); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; line-height: 1.75; }
.passage.long { background: var(--surface); font-size: 1.05rem; }
.gl { font: inherit; background: none; border: 0; padding: 0; color: inherit; text-decoration: underline dotted var(--primary); text-underline-offset: 3px; text-decoration-thickness: 2px; cursor: help; }
.speak-list { list-style: none; padding: 0; }
.s-text { font-size: 1.2rem; font-weight: 600; }
.s-score { font-weight: 600; color: var(--good); }
.said .w-ok { color: var(--good); font-weight: 600; } .said .w-no { color: var(--bad); text-decoration: underline wavy; }
.writing { font-size: 1.05rem; line-height: 1.7; }
.checked { background: var(--surface-2); padding: 12px 14px; border-radius: var(--radius-sm); line-height: 1.8; white-space: normal; }
.checked mark { background: var(--warn-soft); color: inherit; border-bottom: 2px solid var(--warn); cursor: help; padding: 0 1px; }
.issues li { margin: 4px 0; }
.prompt { background: var(--surface-2); box-shadow: none; }
.teacher-fb { background: var(--good-soft); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 10px; }
.result { text-align: center; padding: 30px 18px; }
.result h2 { margin: .3em 0 .2em; }
.result .skillbars { max-width: 380px; margin: 14px auto; text-align: left; }
.test-result .lv-giant { font-size: 5rem; font-weight: 800; line-height: 1; color: var(--lv, var(--primary)); margin: 6px 0; letter-spacing: -.02em; }
.skillbars .sb { display: grid; grid-template-columns: 90px 1fr 32px; align-items: center; gap: 8px; font-size: .88rem; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.badge { text-align: center; padding: 8px 4px; border-radius: 12px; background: var(--surface-2); opacity: .35; filter: grayscale(1); }

/* --- Avviso audio --- */
.audio-alert { position: fixed; z-index: 150; right: 16px; top: 72px; max-width: 420px; display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 14px 16px; border-radius: var(--radius); background: var(--surface); border: 2px solid var(--warn); box-shadow: var(--shadow-hi); animation: rise .3s ease; }

@keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* --- Esercizi --- */
.session { max-width: 720px; margin: 0 auto; border-radius: var(--radius); }
.session-top { display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), color-mix(in srgb, var(--primary) 60%, #7ee0c9)); border-radius: 99px; transition: width .35s ease; }

.exercise { min-height: 160px; }
.q { font-size: 1.2rem; font-weight: 600; margin: 4px 0 12px; line-height: 1.45; }
.gap-q { line-height: 2.3; }

.options { display: grid; gap: 10px; }
.opt { text-align: left; font: inherit; font-size: 1.03rem; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 4px; background: var(--surface); color: var(--text); cursor: pointer; min-height: 52px; transition: border-color .12s, background .12s, transform .08s; }
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 2px; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }

.gap-in { display: inline-block; width: 11em; max-width: 100%; padding: 6px 10px; min-height: 40px; font-size: 1.05rem; border: 2px solid var(--primary); border-radius: 10px; vertical-align: baseline; }
.gap-in.short { width: 4em; }
.gap-in.wide { display: block; width: 100%; margin: 8px 0; }
.gap-in.right { border-color: var(--good); background: var(--good-soft); } .gap-in.wrong { border-color: var(--bad); background: var(--bad-soft); }
.accents { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }

.match { display: grid; gap: 8px; }
.match-row { flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; font-weight: 600; }
.match-row select { max-width: 60%; }
select.right { border-color: var(--good); background: var(--good-soft); } select.wrong { border-color: var(--bad); background: var(--bad-soft); }
.listen-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.listen-row.big .say { padding: 12px 20px; }
.listen-row.big .say .ic { width: 28px; height: 28px; }
.fb { display: flex; flex-direction: column; border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; animation: rise .25s ease; }
.fb.good { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); }
.ok-line, .no-line, .warn-line { display: flex; gap: 8px; align-items: center; }
.ok-line { color: var(--good); font-weight: 600; } .no-line { color: var(--bad); font-weight: 600; } .warn-line { color: var(--warn); font-weight: 600; }

.session-actions { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; bottom: 70px; padding: 10px 0; background: linear-gradient(transparent, var(--bg) 30%); }
.session-actions .go { min-width: 170px; }
@media (min-width: 761px) { .session-actions { bottom: 0; } }
.pulse-good .progress span { animation: glow-good .6s ease; }
.pulse-bad .exercise { animation: shake .35s ease; }
@keyframes glow-good { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* --- Insegnante --- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 14px; }
.kpi { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--text); text-decoration: none; }
a.kpi:hover { border-color: var(--primary); }
.kpi > .ic { width: 40px; height: 40px; padding: 9px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); }
.kpi > div { display: flex; flex-direction: column; min-width: 0; }
.kpi b { font-size: 1.45rem; font-weight: 700; line-height: 1.15; }
.kpi b small { font-size: .85rem; font-weight: 500; color: var(--muted); }
.kpi span { font-size: .8rem; color: var(--muted); }
.kpis.compact { margin: 14px 0 0; }
.kpis.compact .kpi { box-shadow: none; background: var(--surface-2); border-color: transparent; }
.lv-bar { display: flex; height: 30px; border-radius: 12px; overflow: hidden; margin: 0 0 14px; gap: 2px; }
.lv-bar span { display: grid; place-items: center; min-width: 46px; color: #fff; font-size: .78rem; font-weight: 600; white-space: nowrap; overflow: hidden; }
.lvl-bg-A1 { background: var(--a1); } .lvl-bg-A2 { background: var(--a2); } .lvl-bg-B1 { background: var(--b1); } .lvl-bg-B2 { background: var(--b2); } .lvl-bg-C1 { background: var(--c1); } .lvl-bg-na { background: var(--muted); }
.filters { margin: 0 0 12px; }
.filters select { flex: 0 1 180px; }
.table-wrap { overflow-x: auto; padding: 0; }
.table-wrap > p { padding: 0 14px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th, .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl th { background: var(--surface-2); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.tbl th[data-k] { cursor: pointer; user-select: none; }
.tbl th[aria-sort="ascending"]::after { content: " ▲"; } .tbl th[aria-sort="descending"]::after { content: " ▼"; }
.tbl tr.new td { background: var(--warn-soft); }
.tbl .meter { width: 100px; }
.overview tbody tr { cursor: pointer; transition: background .1s; }
.overview tbody tr:hover td { background: color-mix(in srgb, var(--primary-soft) 45%, transparent); }
.overview { font-size: .86rem; }
.overview th { white-space: normal; min-width: 70px; }
.overview th, .overview td { padding: 9px 8px; }
.overview td { white-space: nowrap; }
.overview td:last-child { white-space: normal; min-width: 120px; }
.who { display: flex; gap: 10px; align-items: center; color: var(--text); text-decoration: none; }
.who > span:last-child { display: flex; flex-direction: column; }

.avatar { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; flex: none; font-weight: 700; background: var(--primary-soft); color: var(--primary-2); }

.who.big p { margin: 2px 0 0; }
.lp { display: flex; align-items: center; gap: 8px; }
.lp .meter { width: 80px; margin: 4px 0; }
.lp small { color: var(--muted); font-size: .78rem; }
.spark { width: 70px; height: 20px; display: block; }
.spark rect { fill: var(--primary); } .spark rect.zero { fill: var(--line); }
.trend { font-weight: 600; font-size: .85rem; }
.trend.up { color: var(--good); } .trend.down { color: var(--bad); } .trend.flat { color: var(--muted); }
.st-head { padding: 20px; }
.st-head .actions { margin: 14px 0 0; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg a { padding: 5px 12px; border-radius: 9px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: .86rem; }

.lv-progs { display: grid; gap: 10px; }

.mcell { display: flex; align-items: center; gap: 8px; }

.errlog td { vertical-align: top; }
.errlog td:first-child { min-width: 220px; }
.mini-stats { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 12px; }
.mini-stats span { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }
.mini-stats b { color: var(--text); font-size: 1.05rem; }
.mini-stats .ic { color: var(--primary); }
.activity { list-style: none; padding: 0; margin: 0; max-height: 460px; overflow-y: auto; }
.activity li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.activity li > .ic { color: var(--primary); }
.activity li > span:nth-child(2) { flex: 1; }
.insight { display: flex; gap: 14px; align-items: flex-start; }
.ins-ic { width: 42px; height: 42px; padding: 9px; border-radius: 14px; background: var(--primary-soft); color: var(--primary); }
.insight > div { flex: 1; min-width: 0; }
.insight p { margin: 0 0 4px; }
.insight ul { margin: 6px 0 0; padding-left: 20px; } .insight li { margin: 5px 0; }
.danger-zone summary { color: var(--bad); }
.cred-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.cred { border: 2px dashed var(--line); border-radius: var(--radius-sm); padding: 10px; }

/* --- Grafici --- */
.chart { width: 100%; max-width: 560px; height: auto; display: block; margin: 0 auto; }
.chart .grid { fill: none; stroke: var(--line); stroke-width: 1; }
.chart .area { fill: color-mix(in srgb, var(--primary) 22%, transparent); stroke: var(--primary); stroke-width: 2; }
.chart .lbl { fill: var(--muted); font-size: 10px; font-family: var(--font); }
.chart .line { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; }
.chart .dot { fill: var(--surface); stroke: var(--primary); stroke-width: 2.5; }
.chart .bar { fill: var(--primary-soft); stroke: none; rx: 3; } .chart .bar.ok { fill: var(--primary); }
.chart .goal { stroke: var(--accent); stroke-dasharray: 4 3; stroke-width: 1.5; }
.radar { max-width: 300px; margin: 0 auto; }

/* --- Finestre e notifiche --- */
.modal-wrap { position: fixed; inset: 0; z-index: 100; background: rgba(10, 20, 18, .5); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); color: var(--text); border-radius: 22px; padding: 22px; width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; box-shadow: 0 20px 50px rgba(0, 0, 0, .3); animation: rise .2s ease; }
#toasts { position: fixed; z-index: 200; left: 50%; transform: translateX(-50%); bottom: 90px; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 32px); max-width: 480px; pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 14px; box-shadow: var(--shadow-hi); transition: opacity .4s; font-weight: 500; }
.toast.good { background: var(--good); color: #fff; } .toast.bad { background: var(--bad); color: #fff; } .toast.out { opacity: 0; }

/* --- Stampa --- */
.easy { text-align: center; }
.easy-list { list-style: none; padding: 0; margin: 0 auto 18px; display: inline-flex; flex-direction: column; gap: 10px; text-align: left; font-size: 1.15rem; }
.easy-list span { display: inline-block; width: 1.6em; }
.welcome h1 { margin: 4px 0 12px; }
.easy-q { font-size: 1.5rem; margin: 6px 0 12px; }
.easy-text { font-size: 1.2rem; margin: 0 0 16px; }
.easy-answers { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.easy-a { min-width: 120px; font-size: 1.15rem; justify-content: center; }
/* ---------- Giochi ---------- */
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.game-card { display: flex !important; flex-direction: column; gap: 6px; text-decoration: none; color: var(--text); margin: 0; }
.game-card .g-art { font-size: 1.7rem; line-height: 1.25; padding: 14px; border-radius: 14px; text-align: center; letter-spacing: .1em; font-weight: 700; margin-bottom: 6px; }
.g-bingo .g-art { background: color-mix(in srgb, var(--c-game) 12%, transparent); }
.g-cw .g-art { background: color-mix(in srgb, var(--c-test) 12%, transparent); color: var(--c-test); font-size: 1.2rem; font-family: ui-monospace, monospace; }
.game-card small { color: var(--muted); }
.g-stat { font-size: .8rem; font-weight: 600; color: var(--primary-2, var(--primary)); }
.h-sec { font-size: 1.1rem; margin: 22px 0 8px; } .h-sub { font-size: .9rem; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.src-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-src { display: flex; flex-direction: column; padding: 9px 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); color: var(--text); text-decoration: none; min-width: 90px; }
.chip-src:hover { border-color: var(--c-game); }
.chip-src small { color: var(--muted); font-size: .75rem; }
.chip-src.locked { opacity: .55; flex-direction: row; gap: 6px; align-items: center; }
.chip-src.locked .ic { width: 16px; height: 16px; }
.bingo-wrap { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(280px, 1.3fr); gap: 16px; align-items: start; }
.bingo-call { text-align: center; padding: 18px; }
.call-pic { font-size: 5rem; line-height: 1.1; min-height: 6rem; }
.call-ask { color: var(--muted); margin: 6px 0 12px; }
.hint-len { font-family: ui-monospace, monospace; letter-spacing: .05em; color: var(--text); white-space: nowrap; }
.call-act { display: flex; justify-content: center; }
.call-form { justify-content: center; } .call-form .inp { max-width: 220px; text-align: center; font-size: 1.1rem; }
.call-fb { min-height: 1.6em; margin-top: 10px; }
.call-fb.good { color: var(--good); } .call-fb.bad { color: var(--bad); }
.bingo-card { display: grid; gap: 8px; }
.bingo-card.s3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .bingo-card.s4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.bingo-card.s4 .bcell { font-size: clamp(.68rem, 2.9vw, .88rem); }
.bcell { position: relative; aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; font-size: .95rem; padding: 4px; display: flex; min-width: 0; hyphens: auto; align-items: center; justify-content: center; text-align: center; cursor: pointer; overflow-wrap: break-word; transition: background .2s, border-color .2s; }
.bcell:hover { border-color: var(--c-game); }
.bcell .bp { display: none; position: absolute; top: 4px; right: 6px; font-size: 1.1rem; }
.bcell.on { background: color-mix(in srgb, var(--c-game) 16%, var(--surface)); border-color: var(--c-game); }
.bcell.on .bp { display: block; }
.bcell.win { background: var(--c-game); color: #fff; border-color: var(--c-game); animation: glow-good .8s ease 2; }
.bcell.shake { animation: shake .35s ease; }
.big-emoji { font-size: 3.5rem; }
.cw-num { font-weight: 700; color: var(--lv, var(--primary)); font-size: 1.8rem; }
.cw-wrap { display: grid; grid-template-columns: auto minmax(240px, 1fr); gap: 18px; align-items: start; margin: 12px 0; }
.cw-grid { --cell: min(38px, calc((100vw - 48px) / var(--cols))); display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-auto-rows: var(--cell); gap: 2px; width: max-content; }
.cw-cell { position: relative; background: var(--surface); border: 1.5px solid var(--text); border-radius: 3px; }
.cw-cell.blk { background: transparent; border-color: transparent; }
.cw-cell input { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; padding: 0; text-align: center; text-transform: uppercase; font-weight: 700; font-size: calc(var(--cell) * .5); background: transparent; caret-color: var(--primary); }
.cw-cell input:focus { box-shadow: none; background: color-mix(in srgb, var(--primary) 30%, transparent); }
.cw-cell.hl { background: var(--primary-soft); }
.cw-cell.ok { background: var(--good-soft); } .cw-cell.bad { background: var(--bad-soft, #fde2e2); } .cw-cell.help input { color: var(--muted); }
.cw-n { position: absolute; top: 0; left: 2px; font-size: calc(var(--cell) * .26); line-height: 1; color: var(--muted); pointer-events: none; }
.cw-clues { max-height: 70vh; overflow: auto; }
.cw-clues h3 { font-size: .95rem; margin: 12px 0 4px; }
.cw-list { list-style: none; padding: 0; margin: 0; }
.cw-list li { padding: 5px 8px; border-radius: 8px; cursor: pointer; }
.cw-list li.on { background: var(--primary-soft); }
.cw-bank ul { list-style: none; padding: 0; margin: 4px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.cw-bank li { padding: 3px 10px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: .9rem; }
.cw-bank li.done { text-decoration: line-through; opacity: .5; }
.cw-cell.given input { color: var(--primary-2, var(--primary)); }
.cw-current { margin: 0 0 6px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); min-height: 2.6em; }
.cw-actions { margin-bottom: 16px; }
.cw-words { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; }
@media (max-width: 860px) { .bingo-wrap, .cw-wrap { grid-template-columns: minmax(0, 1fr); } .cw-clues { max-height: none; } .bingo-call { padding: 12px; } .call-pic { font-size: 3.4rem; min-height: 4rem; } .call-ask { margin: 2px 0 8px; } .bcell .bp { font-size: .85rem; top: 2px; right: 3px; } }

@media print {
  header.top, .nav, .mode-banner, .no-print, #toasts, .audio-alert { display: none !important; }
  body { background: #fff; } .view { padding: 0; } .layout { display: block; }
  .card { box-shadow: none; break-inside: avoid; }
  body.print-creds .view > *:not(#creds) { display: none !important; }
  body.print-creds #creds .btn, body.print-creds #creds p { display: none; }
  .cred { break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media (max-width: 520px) {
  .hero { padding: 18px; border-radius: 20px; }
  .hero h1 { font-size: 1.45rem; }
  .hero-stats { width: 100%; flex-wrap: nowrap; gap: 8px; }
  .hs { flex: 1; min-width: 0; padding: 10px 6px; }
  .hero .ring { width: 62px; height: 62px; }
  .hs > span { font-size: .64rem; text-align: center; }
  .hs.streak b { font-size: 1.5rem; }
  .player { gap: 12px; }
  .lock-panel { flex-direction: column; }
}
@media (max-width: 520px) { .hero .ring-txt small { font-size: .5rem; max-width: 50px; } .hero .ring-txt b { font-size: 1rem; } }

/* Uso a distanza senza server: invio dei progressi e link di invito */
.card.highlight { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
.invite-link { width: 100%; font-family: ui-monospace, monospace; font-size: .8rem; word-break: break-all; }
ul.plain { list-style: none; padding: 0; margin: .6rem 0 0; } ul.plain li { margin: .25rem 0; }

</style>

<script>
/* js/shared/handlers.js */
/*
 * Italiano L2 — logica dei dati condivisa.
 * Lo stesso file è usato dal server Node (modalità classe) e dal browser
 * (modalità locale / demo), così le regole su ruoli, permessi e dati sono identiche.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else { root.IL2 = root.IL2 || {}; root.IL2.handlers = factory(); }
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const DAY = 86400000;
  const SESSION_TTL = 30 * DAY;
  const MAX_ACTIVITY = 60000;

  function uid(prefix) {
    return prefix + '_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
  }
  // tiene solo le abilità note, con valori numerici (evita dati arbitrari nel database)
  function cleanSkills(ps) {
    const out = {};
    if (!ps || typeof ps !== 'object') return out;
    for (const k of ['grammatica', 'lessico', 'lettura', 'ascolto']) {
      const v = ps[k]; if (!v || typeof v !== 'object') continue;
      out[k] = { theta: +v.theta || 0, level: ['A1', 'A2', 'B1', 'B2', 'C1'].includes(v.level) ? v.level : 'A1', n: +v.n || 0, correct: +v.correct || 0 };
    }
    return out;
  }
  function fail(status, message) { const e = new Error(message); e.status = status; throw e; }
  function str(v, max, field) {
    if (v === undefined || v === null) return '';
    if (typeof v !== 'string') fail(400, 'Valore non valido: ' + field);
    v = v.trim();
    if (v.length > max) fail(400, 'Testo troppo lungo: ' + field);
    return v;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function emptyDb() {
    return {
      version: 1, settings: null, users: [], profiles: {}, activity: [],
      submissions: [], assignments: [], announcements: [], feedback: [],
      notes: {}, customVocab: [], sessions: {}, loginFails: {}
    };
  }

  function defaultProfile(l1) {
    return {
      l1: l1 || 'en', level: null, theta: null, levelOverride: null,
      skills: { grammatica: 0, lessico: 0, lettura: 0, ascolto: 0, scrittura: 0, parlato: 0 },
      topics: {}, srs: {}, errors: [], unitsDone: {}, readingsDone: {}, listeningsDone: {},
      speakingDone: {}, xp: 0, streak: { count: 0, best: 0, last: null }, badges: [],
      placement: [], nextTestDue: null, testRequested: false, timeLog: {},
      prefs: { fontScale: 1, dyslexia: false, ttsRate: 0.9, showL1: true, contrast: false },
      updatedAt: Date.now()
    };
  }

  // Campi del profilo che lo studente può aggiornare (gli altri sono gestiti dal server o dall'insegnante).
  const STUDENT_FIELDS = ['skills', 'topics', 'srs', 'errors', 'unitsDone', 'readingsDone', 'listeningsDone',
    'speakingDone', 'xp', 'streak', 'badges', 'timeLog', 'prefs', 'gamesDone'];

  function publicUser(u) {
    return {
      id: u.id, role: u.role, username: u.username, displayName: u.displayName, l1: u.l1 || null,
      group: u.group || '', birthYear: u.birthYear || null, createdAt: u.createdAt, avatar: u.avatar || null,
      lastLogin: u.lastLogin || null
    };
  }

  function needAuth(auth) { if (!auth) fail(401, 'Accesso necessario'); }
  function needTeacher(auth) { needAuth(auth); if (auth.role !== 'teacher') fail(403, 'Riservato all\'insegnante'); }
  function needStudent(auth) { needAuth(auth); if (auth.role !== 'student') fail(403, 'Riservato agli studenti'); }

  function findUser(db, id) { return db.users.find(u => u.id === id); }
  function studentOrFail(db, id) {
    const u = findUser(db, id);
    if (!u || u.role !== 'student') fail(404, 'Studente non trovato');
    return u;
  }
  function normUsername(s) {
    return String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._-]/g, '');
  }

  function effectiveLevel(p) { return p.levelOverride || p.level; }

  function computeNextTest(db, fromTs) {
    const weeks = (db.settings && db.settings.retestWeeks) || 8;
    return fromTs + weeks * 7 * DAY;
  }

  function assignmentTargets(a, u) {
    if (!a.target || a.target.type === 'all') return true;
    if (a.target.type === 'group') return (u.group || '') === a.target.value;
    if (a.target.type === 'students') return (a.target.ids || []).includes(u.id);
    if (a.target.type === 'level') return a.target.value === effectiveLevel(u._profile || {});
    return false;
  }

  function summarize(db, u) {
    const p = db.profiles[u.id] || defaultProfile(u.l1);
    const since = Date.now() - 7 * DAY;
    let n = 0, ok = 0, minutes = 0, last = null;
    for (const a of db.activity) {
      if (a.userId !== u.id) continue;
      if (!last || a.at > last) last = a.at;
      if (a.at >= since) { n += a.total || 0; ok += a.correct || 0; minutes += (a.durationSec || 0) / 60; }
    }
    const pendingWriting = db.submissions.filter(s => s.userId === u.id && s.status === 'inviato').length;
    const lastTest = p.placement.length ? p.placement[p.placement.length - 1] : null;
    return {
      ...publicUser(u), level: effectiveLevel(p), levelFromTest: p.level, levelOverride: p.levelOverride,
      skills: p.skills, xp: p.xp, streak: p.streak, lastActivity: last,
      week: { items: n, correct: ok, minutes: Math.round(minutes) },
      lastTest: lastTest ? { at: lastTest.at, level: lastTest.level } : null,
      nextTestDue: p.nextTestDue, testRequested: p.testRequested, pendingWriting,
      unitsDone: Object.keys(p.unitsDone || {}).length,
      wordsLearned: Object.values(p.srs || {}).filter(c => c.box >= 3).length,
      openErrors: (p.errors || []).filter(e => !e.resolved).length
    };
  }

  const methods = {
    // ---------- Pubblici ----------
    async status(db) {
      return { setup: !!db.settings, schoolName: db.settings ? db.settings.schoolName : null };
    },

    async setup(db, auth, p, ctx) {
      if (db.settings) fail(409, 'L\'app è già stata configurata');
      const schoolName = str(p.schoolName, 120, 'scuola') || 'La mia scuola';
      const teacherName = str(p.teacherName, 80, 'nome') || 'Insegnante';
      const username = normUsername(p.username);
      const password = String(p.password || '');
      if (username.length < 3) fail(400, 'Il nome utente deve avere almeno 3 caratteri');
      if (password.length < 8) fail(400, 'La password dell\'insegnante deve avere almeno 8 caratteri');
      db.settings = {
        schoolName, retestWeeks: 8, placementLength: 'standard', allowSelfRetest: false,
        dailyGoalMinutes: 15, createdAt: Date.now()
      };
      const u = {
        id: uid('t'), role: 'teacher', username, displayName: teacherName,
        secret: await ctx.hash(password), createdAt: Date.now()
      };
      db.users.push(u);
      return { ok: true };
    },

    async login(db, auth, p, ctx) {
      if (!db.settings) fail(409, 'App non ancora configurata');
      const username = normUsername(p.username);
      const key = username || '-';
      const lf = db.loginFails[key];
      if (lf && lf.count >= 8 && Date.now() - lf.at < 10 * 60000) fail(429, 'Troppi tentativi. Riprova tra qualche minuto.');
      const u = db.users.find(x => x.username === username);
      const ok = u && await ctx.verify(String(p.secret || ''), u.secret);
      if (!ok) {
        db.loginFails[key] = { count: (lf && Date.now() - lf.at < 10 * 60000 ? lf.count : 0) + 1, at: Date.now() };
        fail(401, 'Nome utente o codice non corretti');
      }
      delete db.loginFails[key];
      const token = ctx.token();
      // pulizia sessioni scadute
      for (const [t, s] of Object.entries(db.sessions)) if (s.exp < Date.now()) delete db.sessions[t];
      db.sessions[token] = { userId: u.id, exp: Date.now() + SESSION_TTL };
      u.lastLogin = Date.now();
      return { token, user: publicUser(u) };
    },

    async logout(db, auth, p) {
      if (auth && auth.token) delete db.sessions[auth.token];
      return { ok: true };
    },

    // ---------- Comuni ----------
    async me(db, auth) {
      needAuth(auth);
      const u = findUser(db, auth.userId);
      const out = { user: publicUser(u), settings: db.settings };
      if (u.role === 'student') {
        if (!db.profiles[u.id]) db.profiles[u.id] = defaultProfile(u.l1);
        const prof = db.profiles[u.id];
        prof.l1 = u.l1 || prof.l1;
        out.profile = prof;
        out.customVocab = db.customVocab;
      }
      return out;
    },

    async changeSecret(db, auth, p, ctx) {
      needAuth(auth);
      const u = findUser(db, auth.userId);
      if (!await ctx.verify(String(p.oldSecret || ''), u.secret)) fail(401, 'Il codice attuale non è corretto');
      const s = String(p.newSecret || '');
      if (u.role === 'teacher' && s.length < 8) fail(400, 'Almeno 8 caratteri');
      if (u.role === 'student' && s.length < 4) fail(400, 'Almeno 4 caratteri');
      u.secret = await ctx.hash(s);
      return { ok: true };
    },

    // ---------- Studente ----------
    async saveProfile(db, auth, p) {
      needStudent(auth);
      const prof = db.profiles[auth.userId] || (db.profiles[auth.userId] = defaultProfile());
      const incoming = p.profile || {};
      for (const k of STUDENT_FIELDS) if (incoming[k] !== undefined) prof[k] = incoming[k];
      if (Array.isArray(prof.errors) && prof.errors.length > 400) prof.errors = prof.errors.slice(-400);
      prof.updatedAt = Date.now();
      return { ok: true, updatedAt: prof.updatedAt };
    },

    async logActivity(db, auth, p) {
      needStudent(auth);
      const entries = Array.isArray(p.entries) ? p.entries.slice(0, 50) : [];
      for (const e of entries) {
        db.activity.push({
          userId: auth.userId, at: Date.now(), type: str(e.type, 30, 'tipo'), ref: str(e.ref, 80, 'ref'),
          skill: str(e.skill, 20, 'abilità'), correct: +e.correct || 0, total: +e.total || 0,
          durationSec: Math.min(+e.durationSec || 0, 7200), topics: Array.isArray(e.topics) ? e.topics.slice(0, 10) : [],
          misses: Array.isArray(e.misses) ? e.misses.slice(0, 30).map(m => String(m).slice(0, 80)) : []
        });
      }
      if (db.activity.length > MAX_ACTIVITY) db.activity = db.activity.slice(-MAX_ACTIVITY);
      return { ok: true };
    },

    async submitPlacement(db, auth, p) {
      needStudent(auth);
      const prof = db.profiles[auth.userId] || (db.profiles[auth.userId] = defaultProfile());
      const r = p.result || {};
      const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];
      if (!LEVELS.includes(r.level)) fail(400, 'Livello non valido');
      const entry = {
        at: Date.now(), level: r.level, sublevel: str(r.sublevel, 10, 'sottolivello'), theta: +r.theta || 0,
        se: +r.se || 0, perSkill: cleanSkills(r.perSkill), items: +r.items || 0, correct: +r.correct || 0,
        durationSec: +r.durationSec || 0, kind: prof.placement.length ? 'periodico' : 'iniziale',
        selfAssessment: str(r.selfAssessment, 120, 'autovalutazione'),
        // item già usati: il test successivo ne proporrà altri (controllo dell'esposizione)
        ids: Array.isArray(r.ids) ? r.ids.filter(x => typeof x === 'string').slice(0, 60).map(x => x.slice(0, 20)) : []
      };
      prof.placement.push(entry);
      prof.level = r.level; prof.theta = entry.theta;
      prof.levelOverride = null;
      prof.testRequested = false;
      prof.nextTestDue = computeNextTest(db, entry.at);
      if (r.skills && typeof r.skills === 'object') for (const k of Object.keys(prof.skills)) if (typeof r.skills[k] === 'number' && isFinite(r.skills[k])) prof.skills[k] = r.skills[k];
      return { ok: true, entry, nextTestDue: prof.nextTestDue };
    },

    async createStudent(db, auth, p, ctx) {
      needTeacher(auth);
      const displayName = str(p.displayName, 60, 'nome');
      if (!displayName) fail(400, 'Inserisci il nome dello studente');
      const username = normUsername(p.username || displayName.split(' ')[0]);
      if (username.length < 2) fail(400, 'Nome utente troppo corto');
      if (db.users.some(u => u.username === username)) fail(409, 'Il nome utente "' + username + '" esiste già');
      const pin = String(p.secret || '');
      if (!/^\S{4,32}$/.test(pin)) fail(400, 'Il codice deve avere almeno 4 caratteri, senza spazi');
      const u = {
        id: uid('s'), role: 'student', username, displayName, secret: await ctx.hash(pin),
        l1: str(p.l1, 10, 'lingua') || 'en', group: str(p.group, 40, 'gruppo'),
        birthYear: p.birthYear ? +p.birthYear : null, createdAt: Date.now()
      };
      db.users.push(u);
      db.profiles[u.id] = defaultProfile(u.l1);
      return publicUser(u);
    },

    async updateStudent(db, auth, p, ctx) {
      needTeacher(auth);
      const u = studentOrFail(db, p.id);
      const prof = db.profiles[u.id] || (db.profiles[u.id] = defaultProfile(u.l1));
      if (p.displayName !== undefined) u.displayName = str(p.displayName, 60, 'nome') || u.displayName;
      if (p.l1 !== undefined) { u.l1 = str(p.l1, 10, 'lingua'); prof.l1 = u.l1; }
      if (p.group !== undefined) u.group = str(p.group, 40, 'gruppo');
      if (p.birthYear !== undefined) u.birthYear = p.birthYear ? +p.birthYear : null;
      if (p.secret) {
        if (!/^\S{4,32}$/.test(String(p.secret))) fail(400, 'Il codice deve avere almeno 4 caratteri, senza spazi');
        u.secret = await ctx.hash(String(p.secret));
      }
      if (p.levelOverride !== undefined) {
        if (p.levelOverride && !['A1', 'A2', 'B1', 'B2', 'C1'].includes(p.levelOverride)) fail(400, 'Livello non valido');
        prof.levelOverride = p.levelOverride || null;
      }
      if (p.testRequested !== undefined) prof.testRequested = !!p.testRequested;
      return publicUser(u);
    },

      if (s.retestWeeks !== undefined) {
        const w = Math.max(2, Math.min(26, parseInt(s.retestWeeks, 10) || 8));
        if (w !== db.settings.retestWeeks) {
          db.settings.retestWeeks = w;
          // ricalcola le scadenze in base all'ultimo test
          for (const [id, prof] of Object.entries(db.profiles)) {
            const last = prof.placement && prof.placement[prof.placement.length - 1];
            if (last) prof.nextTestDue = computeNextTest(db, last.at);
          }
        }
      }
      if (s.placementLength !== undefined) db.settings.placementLength = ['breve', 'standard', 'esteso'].includes(s.placementLength) ? s.placementLength : 'standard';
      if (s.allowSelfRetest !== undefined) db.settings.allowSelfRetest = !!s.allowSelfRetest;
      if (s.dailyGoalMinutes !== undefined) db.settings.dailyGoalMinutes = Math.max(5, Math.min(90, parseInt(s.dailyGoalMinutes, 10) || 15));
      return db.settings;
    },

    // ---------- Uso a distanza senza server ----------
    // L'insegnante manda a ogni studente un link di invito; lo studente studia sul suo dispositivo

    async acceptInvite(db, auth, p, ctx) {
      // solo nella versione che gira nel browser dello studente, mai sul server
      if (!ctx || !ctx.allowInvite) fail(403, 'Funzione non disponibile');
      const d = p.data;
      if (!d || d.tipo !== 'il2-invito' || !d.user || !d.settings) fail(400, 'Link di invito non valido');
      if (db.users.some(u => u.role === 'teacher')) fail(409, 'Su questo dispositivo c\'è già un insegnante');
      const inc = d.user;
      if (typeof inc.id !== 'string' || typeof inc.secret !== 'string') fail(400, 'Link di invito non valido');
      const other = db.users.find(u => u.id !== inc.id);
      if (other && !p.replace) fail(409, 'Su questo dispositivo studia già ' + other.displayName);
      if (other) { for (const k of Object.keys(db)) delete db[k]; Object.assign(db, emptyDb()); }
      db.settings = Object.assign({}, db.settings || {}, d.settings);
      let u = findUser(db, inc.id);
      const fields = { username: normUsername(inc.username), displayName: str(inc.displayName, 60, 'nome'), secret: inc.secret,
        l1: str(inc.l1, 10, 'lingua') || 'en', group: str(inc.group, 40, 'gruppo'), birthYear: inc.birthYear || null };
      if (u) Object.assign(u, fields);
      else { u = { id: inc.id, role: 'student', createdAt: inc.createdAt || Date.now(), ...fields }; db.users.push(u); }
      const prof = db.profiles[u.id] || (db.profiles[u.id] = defaultProfile(u.l1));
      const t = d.teacher || {};
      prof.levelOverride = ['A1', 'A2', 'B1', 'B2', 'C1'].includes(t.levelOverride) ? t.levelOverride : null;
      // una richiesta di test già soddisfatta da un test fatto dopo l'invito non torna attiva
      const lastTest = prof.placement.length ? prof.placement[prof.placement.length - 1].at : 0;
      prof.testRequested = !!t.testRequested && lastTest < (d.at || 0);
      if (t.nextTestDue && (!prof.nextTestDue || lastTest < (d.at || 0))) prof.nextTestDue = t.nextTestDue;
      for (const r of Array.isArray(d.reviews) ? d.reviews : []) {
        const s = db.submissions.find(x => x.id === r.id && x.userId === u.id);
        if (s && (!s.reviewedAt || s.reviewedAt < r.reviewedAt)) {
          s.teacherFeedback = str(r.teacherFeedback, 5000, 'commento'); s.corrected = str(r.corrected, 9000, 'correzione');
          s.status = 'corretto'; s.reviewedAt = r.reviewedAt; s.seen = false;
        }
      }
      if (Array.isArray(d.customVocab)) db.customVocab = d.customVocab;
      const token = ctx.token();
      db.sessions = { [token]: { userId: u.id, exp: Date.now() + 10 * 365 * DAY } };
      u.lastLogin = Date.now();
      return { token, user: publicUser(u) };
    },

    async exportProgress(db, auth) {
      needStudent(auth);
      const u = findUser(db, auth.userId);
      return {
        tipo: 'il2-progressi', v: 1, exportedAt: Date.now(),
        user: publicUser(u), profile: db.profiles[u.id] || defaultProfile(u.l1),
        activity: db.activity.filter(a => a.userId === u.id),
        submissions: db.submissions.filter(s => s.userId === u.id),
        feedback: db.feedback.filter(f => f.userId === u.id)
      };

    async importProgress(db, auth, p) {
      needTeacher(auth);
      const d = p.data;
      if (!d || d.tipo !== 'il2-progressi' || !d.user || !d.profile) fail(400, 'Questo file non contiene i progressi di uno studente');
      const u = db.users.find(x => x.role === 'student' && x.id === d.user.id);
      if (!u) fail(404, 'Lo studente ' + (d.user.displayName || '') + ' non è nell\'elenco: il file viene da un altro invito');
      const prof = db.profiles[u.id] || (db.profiles[u.id] = defaultProfile(u.l1));
      const inc = d.profile;
      const newer = !prof.updatedAt || !inc.updatedAt || inc.updatedAt >= prof.updatedAt || (inc.placement || []).length > prof.placement.length;
      if (newer) {
        const keep = { levelOverride: prof.levelOverride, testRequested: prof.testRequested };
        const before = prof.placement.length;
        for (const k of STUDENT_FIELDS) if (inc[k] !== undefined) prof[k] = inc[k];
        for (const k of ['placement', 'level', 'theta', 'nextTestDue']) if (inc[k] !== undefined) prof[k] = inc[k];
        prof.levelOverride = keep.levelOverride;
        prof.testRequested = keep.testRequested && prof.placement.length <= before;
        prof.updatedAt = inc.updatedAt || Date.now();
      }
      const seen = new Set(db.activity.filter(a => a.userId === u.id).map(a => a.at + '|' + a.type + '|' + a.ref));
      let added = 0;
      for (const a of Array.isArray(d.activity) ? d.activity : []) {
        const k = a.at + '|' + a.type + '|' + a.ref;
        if (seen.has(k)) continue;
        seen.add(k); added++;
        db.activity.push({ ...a, userId: u.id });
      }
      db.activity.sort((a, b) => a.at - b.at);
      let writings = 0;
      for (const s of Array.isArray(d.submissions) ? d.submissions : []) {
        if (db.submissions.some(x => x.id === s.id)) continue;
        db.submissions.push({ ...s, userId: u.id, status: 'inviato', teacherFeedback: '', reviewedAt: null }); writings++;
      }
      for (const f of Array.isArray(d.feedback) ? d.feedback : []) if (!db.feedback.some(x => x.id === f.id)) db.feedback.push({ ...f, userId: u.id });
      if (d.user.lastLogin && (!u.lastLogin || d.user.lastLogin > u.lastLogin)) u.lastLogin = d.user.lastLogin;
      return { ok: true, student: u.displayName, profileUpdated: newer, activityAdded: added, newWritings: writings, sentAt: d.exportedAt };
    },

    async exportData(db, auth) {
      needTeacher(auth);
      const out = clone(db);
      delete out.sessions; delete out.loginFails;
      out.users = out.users.map(u => ({ ...u, secret: u.role === 'teacher' ? u.secret : u.secret }));
      out.exportedAt = Date.now();

    async exportAnonymous(db, auth) {
      needTeacher(auth);
      // Dati senza nomi né codici: utili per la revisione periodica dei contenuti e dell'app.
      const map = {}; let n = 0;
      for (const u of db.users) if (u.role === 'student') map[u.id] = 'S' + (++n);
      return {
        exportedAt: Date.now(), retestWeeks: db.settings.retestWeeks,
        students: db.users.filter(u => u.role === 'student').map(u => {
          const p = db.profiles[u.id] || {};
          return { id: map[u.id], l1: u.l1, level: effectiveLevel(p), skills: p.skills, placement: (p.placement || []).map(x => ({ at: x.at, level: x.level, theta: x.theta })) };
        }),
        activity: db.activity.filter(a => map[a.userId]).map(a => ({ ...a, userId: map[a.userId] })),
        feedback: db.feedback.filter(f => map[f.userId]).map(f => ({ ...f, userId: map[f.userId] }))
      };
    },

    async importData(db, auth, p) {
      needTeacher(auth);
      const d = p.data;
      if (!d || !Array.isArray(d.users) || !d.settings) fail(400, 'File di backup non valido');
      if (!d.users.some(u => u.role === 'teacher')) fail(400, 'Il backup non contiene un insegnante');
      const fresh = Object.assign(emptyDb(), clone(d));

      theory: `
<p><b>Pronomi relativi</b></p>
<ul><li><b>che</b> = soggetto o oggetto: <i>Il ragazzo <b>che</b> parla è Ali. Il libro <b>che</b> leggo è giallo.</i></li>
<li><b>cui</b> dopo una preposizione: <i>La città <b>in cui</b> vivo. L'amica <b>con cui</b> studio. Il motivo <b>per cui</b> sono qui.</i></li>
<li><b>il cui / la cui</b> = possesso: <i>Lo scrittore <b>il cui</b> libro ho letto.</i></li>
<li><b>il quale, la quale, i quali, le quali</b>: più formale, può sostituire che/cui: <i>La persona <b>alla quale</b> ho scritto.</i></li>
<li><b>chi</b> = colui che / le persone che: <i><b>Chi</b> studia, impara.</i></li>
<li><b>quello che / ciò che</b> = la cosa che: <i>Non capisco <b>quello che</b> dici.</i></li>
<li><b>dove</b> per i luoghi: <i>La scuola <b>dove</b> studio</i> (= in cui).</li></ul>
<p><b>Ci</b> sostituisce:</p>
<ul><li>un luogo: <i>Vai a Roma? — Sì, <b>ci</b> vado domani.</i></li>
<li>a/in/su + qualcosa: <i>Pensi all'esame? — Sì, <b>ci</b> penso sempre. Credi agli oroscopi? — No, non <b>ci</b> credo.</i></li></ul>
<p><b>Ne</b> sostituisce:</p>
<ul><li>una quantità: <i><b>Ne</b> voglio due.</i></li>

/* Indici e utilità sui contenuti (caricato dopo tutti i file di contenuto). */
(function () {
  'use strict';
  const C = window.IL2.content;
  const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1'];

  // Lessico: dalle righe compatte agli oggetti parola.
  C.vocab = (C.vocabRaw || []).map(theme => {
    const words = theme.rows.trim().split('\n').map(line => line.split('|').map(s => s.trim())).filter(f => f[0]).map(f => {
      if (theme.mono) return { id: theme.id + ':' + f[0], it: f[0], def: f[1], gloss: { en: f[2] }, ex: f[3] || '' };
      const g = {}; window.IL2.l1.ORDER.forEach((c, i) => { if (f[i + 1]) g[c] = f[i + 1]; });
      return { id: theme.id + ':' + f[0], it: f[0], gloss: g, ex: f[13] || '' };
    });
    return { id: theme.id, level: theme.level, title: theme.title, icon: theme.icon, mono: !!theme.mono, studio: !!theme.studio, materia: theme.materia || null, words };
  }).sort((a, b) => LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level));
  delete C.vocabRaw;

  C.wordById = {};
  for (const th of C.vocab) for (const w of th.words) { w.theme = th.id; w.level = th.level; C.wordById[w.id] = w; }

  C.units.sort((a, b) => a.id.localeCompare(b.id));
  C.itemByUid = {};
  function tag(list, prefix, level, skill) {
    list.forEach((it, i) => {
      it.uid = prefix + '#' + i;
      it.lv = it.lv || level;
      it.skill = it.skill || skill;
      C.itemByUid[it.uid] = it;
    });
  }
  for (const u of C.units) tag(u.items, u.id, u.level, 'grammatica');
  for (const r of C.readings) tag(r.questions, r.id, r.level, 'lettura');
  for (const l of C.listenings) tag(l.questions, l.id, l.level, 'ascolto');

  C.unitById = Object.fromEntries(C.units.map(u => [u.id, u]));
  C.readingById = Object.fromEntries(C.readings.map(r => [r.id, r]));
  C.listeningById = Object.fromEntries(C.listenings.map(r => [r.id, r]));
  C.writingById = Object.fromEntries(C.writing.map(r => [r.id, r]));
  C.vocabById = Object.fromEntries(C.vocab.map(r => [r.id, r]));

  // Esercizi di un argomento (per il rinforzo mirato).
  C.itemsForTopic = function (topic) {

    { re: /[,;:!?](?=[A-Za-zÀ-ÿ])|\.(?=[A-ZÀ-Ý][a-zà-ÿ])/g, fix: m => m + ' ', msg: 'Dopo la punteggiatura serve uno spazio.' }
  ];

  const CONNECTIVES = {
    base: ['e', 'ma', 'perché', 'poi', 'quando', 'anche', 'però', 'quindi', 'allora', 'invece', 'mentre', 'prima', 'dopo'],
    medio: ['siccome', 'infatti', 'inoltre', 'per questo', 'anche se', 'invece', 'alla fine', 'secondo me', 'per esempio', 'dato che', 'visto che', 'perciò', 'cioè'],
    alto: ['tuttavia', 'benché', 'sebbene', 'nonostante', 'affinché', 'purché', 'pertanto', 'dunque', 'innanzitutto', 'in conclusione', 'd\'altra parte', 'ciononostante', 'qualora', 'in primo luogo', 'in secondo luogo', 'ovvero', 'eppure', 'alla luce di', 'a mio avviso']
  };

  function words(text) { return (text.toLowerCase().match(/[a-zà-ÿ']+/gi) || []).filter(w => w.length > 0); }

  function check(text, task) {
    const issues = [];
    for (const r of RULES) {
      if (!r.msg) continue;
      r.re.lastIndex = 0; let m;
      while ((m = r.re.exec(text))) {
        if (r.test && !r.test(m[0], text, m.index)) continue;
        issues.push({ at: m.index, len: m[0].length, text: m[0], fix: r.fix ? r.fix(m[0]) : null, msg: r.msg });
        if (issues.length > 60) break;
      }
    }
    // maiuscola a inizio frase
    const sentRe = /(^|[.!?]\s+)([a-zà-ÿ])/g; let m;
    while ((m = sentRe.exec(text))) {
      const at = m.index + m[1].length;
      const msg = 'All\'inizio della frase ci vuole la lettera maiuscola.';
      const same = issues.find(i => i.at === at && i.fix);
      if (same) { same.fix = same.fix.charAt(0).toUpperCase() + same.fix.slice(1); same.msg += ' ' + msg; }
      else issues.push({ at, len: 1, text: m[2], fix: m[2].toUpperCase(), msg });
    }
    issues.sort((a, b) => a.at - b.at);
    // elimina sovrapposizioni
    const clean = []; let end = -1;
    for (const i of issues) { if (i.at >= end) { clean.push(i); end = i.at + i.len; } }

    const w = words(text);
    const unique = new Set(w.filter(x => x.length > 3));
    const sentences = text.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
    const lower = ' ' + text.toLowerCase().replace(/\s+/g, ' ') + ' ';
    const used = {}; for (const [lvl, list] of Object.entries(CONNECTIVES)) used[lvl] = list.filter(c => lower.includes(' ' + c + ' ') || lower.includes(' ' + c + ','));
    const stats = {
      words: w.length, sentences: sentences.length, avgSentence: sentences.length ? Math.round(w.length / sentences.length) : 0,
      variety: w.length ? Math.round(100 * unique.size / Math.max(1, w.filter(x => x.length > 3).length)) : 0,
      connectives: used
    };
    const tips = [];
    if (task) {
      if (stats.words < task.min) tips.push('Il testo è più corto del richiesto (' + stats.words + ' parole su almeno ' + task.min + ').');
      if (task.max && stats.words > task.max * 1.25) tips.push('Il testo è molto più lungo del richiesto: prova a essere più sintetico.');
      const missing = (task.use || []).filter(u => !lower.includes(u.toLowerCase().replace(/\/.*$/, '').replace(/\.\.\.|…/g, '').trim()));
      if (missing.length) tips.push('Prova a usare anche: ' + missing.join(', ') + '.');
      const lv = task.level;
      if ((lv === 'B1' || lv === 'B2' || lv === 'C1') && used.medio.length + used.alto.length < 2) tips.push('Collega meglio le idee con connettivi come: inoltre, infatti, quindi, tuttavia.');
      if ((lv === 'B2' || lv === 'C1') && used.alto.length < 2) tips.push('Per il tuo livello usa connettivi più ricchi: tuttavia, benché, pertanto, in conclusione…');
    }
    if (stats.avgSentence > 35) tips.push('Alcune frasi sono molto lunghe: prova a dividerle con il punto.');
    if (stats.words > 40 && stats.variety < 45) tips.push('Ripeti spesso le stesse parole: cerca dei sinonimi.');
    return { issues: clean, stats, tips };
  }

  // Testo con evidenziati i punti segnalati (HTML sicuro).
  function highlight(text, issues) {
    const esc = IL2.ui.esc; let out = '', pos = 0;
    issues.forEach((i, k) => {
      out += esc(text.slice(pos, i.at));
      out += '<mark title="' + esc(i.msg) + '" data-i="' + k + '">' + esc(text.slice(i.at, i.at + i.len)) + '</mark>';
      pos = i.at + i.len;
    });
    return (out + esc(text.slice(pos))).replace(/\n/g, '<br>');
  }

  IL2.checker = { check, highlight, CONNECTIVES };
})();
