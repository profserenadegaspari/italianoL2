  // =================== SUGGERIMENTI ===================
  // Analisi automatica dei dati degli studenti per orientare la didattica e migliorare l'app.
  function analyze(data) {
    const now = Date.now(); const out = [];
    const st = data.students; const profiles = data.profiles;
    if (!st.length) return out;
    // 1. Esercizi problematici: sbagliati dalla maggior parte di chi li ha svolti.
    const attempts = {}, misses = {};
    for (const a of data.activity) {
      if (!a.ref) continue;
      const src = a.type === 'unit' ? C.unitById[a.ref] : a.type === 'reading' ? C.readingById[a.ref] : a.type === 'listening' ? C.listeningById[a.ref] : null;
      if (!src) continue;
      const items = src.items || src.questions;
      for (const it of items) { attempts[it.uid] = attempts[it.uid] || new Set(); attempts[it.uid].add(a.userId); }
      for (const m of a.misses || []) { misses[m] = misses[m] || new Set(); misses[m].add(a.userId); }
    }
    const hard = Object.keys(misses).map(uid => ({ uid, miss: misses[uid].size, tot: attempts[uid] ? attempts[uid].size : misses[uid].size })).filter(x => x.tot >= 3 && x.miss / x.tot >= 0.6 && C.itemByUid[x.uid]).sort((a, b) => b.miss / b.tot - a.miss / a.tot).slice(0, 6);
    if (hard.length) out.push({ icon: 'alert', title: 'Esercizi sbagliati dalla maggior parte degli studenti', prio: 2, body: 'Possono indicare un argomento da riprendere a lezione oppure una consegna poco chiara.', list: hard.map(x => { const it = C.itemByUid[x.uid]; return esc(itemText(it).slice(0, 100)) + ' — <b>' + x.miss + '/' + x.tot + '</b> studenti' + (it.topic && C.topics[it.topic] ? ' · ' + esc(C.topics[it.topic].name) : '') + ' <small class="muted">(' + x.uid + ')</small>'; }) });
    // 2. Argomenti deboli per molti studenti.
    const agg = {};
    for (const p of Object.values(profiles)) for (const [t, v] of Object.entries(p.topics || {})) { if (v.n < 3 || !C.topics[t]) continue; (agg[t] = agg[t] || []).push(E.topicMastery(p, t)); }
    const weak = Object.entries(agg).filter(([, v]) => v.length >= 2).map(([t, v]) => ({ t, m: v.reduce((a, b) => a + b, 0) / v.length, n: v.length })).filter(x => x.m < 0.55).sort((a, b) => a.m - b.m).slice(0, 5);
    if (weak.length) out.push({ icon: 'target', title: 'Argomenti difficili per più studenti', prio: 2, body: 'Padronanza media bassa tra gli studenti che li hanno praticati: possono essere spunti per la lezione in presenza.', list: weak.map(x => esc(C.topics[x.t].name) + ' (' + C.topics[x.t].lv + ') — padronanza media ' + Math.round(x.m * 100) + '% su ' + x.n + ' studenti') });
    // 3. Difficoltà per lingua d'origine (note contrastive in italiano, solo per l'insegnante).
    const byL1 = {};
    for (const s of st) (byL1[s.l1] = byL1[s.l1] || []).push(s);
    const l1s = [];
    for (const [l1, group] of Object.entries(byL1)) {
      if (group.length < 2) continue;
      const tt = {};
      for (const s of group) for (const [t, v] of Object.entries((profiles[s.id] || {}).topics || {})) { if (v.n < 3 || !C.topics[t]) continue; (tt[t] = tt[t] || []).push(E.topicMastery(profiles[s.id], t)); }
      const w = Object.entries(tt).map(([t, v]) => ({ t, m: v.reduce((a, b) => a + b, 0) / v.length })).sort((a, b) => a.m - b.m)[0];
      if (w && w.m < 0.6) { const tip = IL2.l1.tip(l1, w.t); l1s.push('<b>' + esc(IL2.l1.name(l1)) + '</b> (' + group.length + ' studenti): ' + esc(C.topics[w.t].name) + ' ' + Math.round(w.m * 100) + '%' + (tip ? '<br><small>Nota contrastiva: ' + esc(tip.it) + '</small>' : '')); }
    }
    if (l1s.length) out.push({ icon: 'globe', title: 'Difficoltà per lingua d\'origine', prio: 3, body: 'Argomento più debole per ciascun gruppo linguistico.', list: l1s });
    // 4. Studenti inattivi.
    const inactive = st.filter(s => !s.lastActivity || now - s.lastActivity > 7 * DAY);
    if (inactive.length) out.push({ icon: 'clock', title: 'Studenti senza attività da più di 7 giorni', prio: 1, body: 'Una parola di incoraggiamento in classe può aiutarli a riprendere.', list: inactive.map(s => '<a href="#/studente/' + s.id + '">' + esc(s.displayName) + '</a> — ultima attività: ' + ago(s.lastActivity)) });
    // 5. Test di livello.
    const due = st.filter(s => s.lastTest && s.nextTestDue && s.nextTestDue <= now);
    const never = st.filter(s => !s.lastTest);
    if (due.length || never.length) out.push({ icon: 'compass', title: 'Test di livello in sospeso', prio: 1, body: 'Gli studenti vedono l\'invito al test nella pagina Oggi.', list: never.map(s => esc(s.displayName) + ' — test iniziale non ancora svolto').concat(due.map(s => esc(s.displayName) + ' — periodico scaduto il ' + fmtDate(s.nextTestDue))) });
    // 6. Pronti per salire di livello.
    const ready = st.filter(s => { const p = profiles[s.id]; if (!p || !s.lastTest) return false; if (E.levelUpReady(p)) return true; if (p.theta == null) return false; const v = ['grammatica', 'lessico', 'lettura', 'ascolto'].map(k => p.skills[k]); const avg = v.reduce((a, b) => a + b, 0) / v.length; return avg - p.theta > 0.5 && E.levelFromTheta(avg) !== s.level; });
    if (ready.length) out.push({ icon: 'sparkle', title: 'Possibili passaggi di livello', prio: 2, body: 'Hanno completato gran parte delle lezioni del livello o mostrano progressi superiori all\'ultimo test.', list: ready.map(s => '<a href="#/studente/' + s.id + '">' + esc(s.displayName) + '</a> (' + s.level + ')' + (s.testRequested ? ' · test richiesto' : ' <button class="btn small" data-req="' + s.id + '">Richiedi test</button>')) });
    // 7. Studio sotto l'obiettivo.
    const goal = (IL2.state.settings || {}).dailyGoalMinutes || 15;
    const low = st.filter(s => s.lastActivity && now - s.lastActivity <= 7 * DAY && s.week.minutes < goal * 2);
    if (low.length) out.push({ icon: 'clock', title: 'Tempo di studio basso', prio: 3, body: 'Attivi ma con meno di ' + goal * 2 + ' minuti nell\'ultima settimana (obiettivo: ' + goal + ' min al giorno).', list: low.map(s => esc(s.displayName) + ' — ' + s.week.minutes + ' min') });
    // 8. Scritti.
    const pend = data.submissions.filter(s => s.status === 'inviato');
    if (pend.length) out.push({ icon: 'pen', title: pend.length + ' scritti nuovi da leggere', prio: 1, body: 'Un commento rapido sulla scrittura è tra le cose che aiutano di più.', list: ['<a class="btn small" href="#/scritti">Vai agli scritti</a>'] });
    return out.sort((a, b) => a.prio - b.prio);
  }

    if (tab === 'lessico') h += C.vocab.map(t => '<details class="card"><summary>' + levelBadge(t.level) + ' ' + t.icon + ' <b>' + esc(t.title) + '</b> · ' + t.words.length + ' parole</summary><table class="tbl small">' + t.words.map(w => '<tr><td><b>' + esc(w.it) + '</b></td><td>' + esc(w.def || [w.gloss.en, w.gloss.fr, w.gloss.ar, w.gloss.zh].filter(Boolean).join(' · ')) + '</td><td><i>' + esc(w.ex) + '</i></td></tr>').join('') + '</table></details>').join('');
    if (tab === 'lingue') h += '<p>Per gli studenti la lingua d\'origine compare <b>solo nel dizionario</b>, come traduzione delle parole: tutto il resto dell\'app è in italiano. Le note contrastive qui sotto sono in italiano e le vedi solo tu, nella scheda di ogni studente e nei suggerimenti. In un contesto ufficiale è opportuno far verificare le traduzioni da mediatori linguistici: puoi segnalare correzioni con la revisione periodica.</p>' + IL2.l1.ORDER.map(c => { const p = IL2.l1.profile(c); return '<details class="card"><summary><b>' + esc(p.name) + '</b> · ' + esc(p.native) + '</summary>' + (p.general ? '<p>' + esc(p.general.it) + '</p>' : '') + '<ul>' + Object.entries(p.tips).map(([k, t]) => '<li><b>' + esc(topicName(k)) + ':</b> ' + esc(t.it) + '</li>').join('') + '</ul>' + (p.friends.length ? '<p><b>Falsi amici:</b> ' + p.friends.map(f => esc(f[0]) + ' = ' + esc(f[1])).join(' · ') + '</p>' : '') + '</details>'; }).join('');
    if (tab === 'test') h += '<div class="card"><h3>Come funziona il test di livello</h3><ul><li>Banca di ' + s.placement + ' domande calibrate sui livelli A1–C1 (grammatica, lessico, lettura, ascolto).</li><li>Test adattivo: ogni domanda è scelta in base alle risposte precedenti (modello di Rasch, stima bayesiana EAP).</li><li>Si ferma quando la stima è abbastanza precisa (o al numero massimo di domande, regolabile nelle impostazioni).</li><li>Nei test periodici evita le domande dell\'ultimo test e parte dal livello precedente.</li><li>Restituisce il livello QCER, la posizione nel livello (iniziale, intermedio, avanzato) e un profilo per abilità.</li><li>Il livello raggiunto sblocca le lezioni di quel livello e dei precedenti. Chi completa l\'80% delle lezioni del proprio livello può anticipare il test.</li></ul><p class="small muted">Le soglie e la difficoltà delle domande sono una calibrazione iniziale: con l\'uso reale, la revisione periodica può ricalibrarle sui dati raccolti.</p></div>' +
      E.LEVELS.map(lv => '<details class="card"><summary>' + levelBadge(lv) + ' ' + C.placement.filter(x => x.lv === lv).length + ' domande</summary><ol class="small">' + C.placement.filter(x => x.lv === lv).map(x => '<li>[' + x.skill + '] ' + (x.text ? '<i>' + esc(x.text) + '</i> ' : '') + (x.say ? '(audio) <i>' + esc(x.say) + '</i> ' : '') + esc(x.q) + ' → <b>' + esc(x.o[0]) + '</b></li>').join('') + '</ol></details>').join('');
    if (tab === 'mie') {
      h += '<div class="card"><h3>Nuova lista di parole</h3><p class="small">Crea liste di lessico per i tuoi studenti (es. parole di una lezione di storia): compaiono nella sezione Parole di chi ha raggiunto il livello indicato. Una parola per riga: <code>parola; spiegazione; esempio</code>.</p><form id="cvf" class="stack"><input type="hidden" name="id"><div class="grid-form"><label>Titolo<input name="title" required maxlength="80"></label><label>Livello<select name="level">' + E.LEVELS.map(l => '<option>' + l + '</option>').join('') + '</select></label></div><textarea name="words" rows="8" placeholder="il triangolo; figura con tre lati; Il triangolo ha tre angoli."></textarea><div class="row"><button class="btn primary">Salva lista</button><button type="button" class="btn ghost" id="cvnew">Nuova</button></div></form></div>' +
        (cv.length ? cv.map(v => '<div class="card"><div class="row between"><b>' + esc(v.title) + '</b><span>' + levelBadge(v.level) + ' ' + v.words.length + ' parole <button class="btn small ghost" data-edit="' + v.id + '">Modifica</button><button class="btn small danger" data-del="' + v.id + '">Elimina</button></span></div></div>').join('') : '<p class="muted">Nessuna lista personale.</p>');
    }
    view.innerHTML = h;
    if (tab === 'mie') {
      const f = view.querySelector('#cvf');
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const words = f.words.value.split('\n').map(l => l.split(';').map(x => x.trim())).filter(x => x[0]).map(([it, gloss, ex]) => ({ it, gloss: gloss || '', ex: ex || '' }));
        try { await IL2.api.call('saveCustomVocab', { list: { id: f.id.value || undefined, title: f.title.value, level: f.level.value, words } }); toast('Lista salvata', 'good'); R.contenuti(view, parts, q); } catch (err) { toast(err.message, 'bad'); }
      });
      view.querySelector('#cvnew').addEventListener('click', () => { f.reset(); f.id.value = ''; });
      view.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => { const v = cv.find(x => x.id === b.dataset.edit); f.id.value = v.id; f.title.value = v.title; f.level.value = v.level; f.words.value = v.words.map(w => [w.it, w.gloss, w.ex].join('; ')).join('\n'); f.scrollIntoView(); }));
      view.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => { if (await confirm('Eliminare la lista?', 'Elimina', true)) { await IL2.api.call('deleteCustomVocab', { id: b.dataset.del }); R.contenuti(view, parts, q); } }));
    }
  };

  R.anteprima = async function (view, parts) {
    const u = C.unitById[parts[0]]; if (!u) return IL2.go('contenuti');
    view.innerHTML = '<a class="back" href="#/contenuti">' + icon('back') + 'Contenuti</a><h1>' + u.icon + ' ' + esc(u.title) + ' ' + levelBadge(u.level) + '</h1><p class="can">' + icon('target') + ' ' + esc(u.can) + '</p><p class="small muted">Argomenti: ' + u.topics.map(t => esc(topicName(t))).join(', ') + '</p><div class="card theory">' + u.theory + '</div>' +
      '<h2>Esercizi con soluzioni</h2><ol class="card">' + u.items.map(it => '<li><span class="tag">' + it.t + '</span> ' + esc(itemText(it)) + ' → <b>' + esc(answerOf(it)) + '</b>' + (it.exp ? '<br><small class="muted">' + esc(it.exp) + '</small>' : '') + '</li>').join('') + '</ol>' +
      '<button class="btn" id="try">Prova gli esercizi come uno studente</button>';
    view.querySelector('#try').addEventListener('click', async () => {
      await IL2.exercises.runSession(view, { title: u.title, items: u.items });
      R.anteprima(view, parts);
    });
  };

  // =================== IMPOSTAZIONI ===================
  R.impostazioni = async function (view) {
    const s = IL2.state.settings;
    view.innerHTML = head('Impostazioni') + '<div class="card"><form id="sf" class="stack">' +
      '<label>Nome della scuola o del corso<input name="schoolName" value="' + esc(s.schoolName) + '" maxlength="120"></label>' +
      '<div class="grid-form"><label>Frequenza del test periodico<select name="retestWeeks">' + [4, 6, 8, 10, 12, 16, 20, 26].map(w => '<option value="' + w + '"' + (w === s.retestWeeks ? ' selected' : '') + '>ogni ' + w + ' settimane</option>').join('') + '</select></label>' +
      '<label>Lunghezza del test<select name="placementLength">' + [['breve', 'Breve (14–20 domande)'], ['standard', 'Standard (20–30)'], ['esteso', 'Esteso (28–40)']].map(([v, l]) => '<option value="' + v + '"' + (v === s.placementLength ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
      '<label>Obiettivo giornaliero<select name="dailyGoalMinutes">' + [10, 15, 20, 30, 45].map(m => '<option value="' + m + '"' + (m === s.dailyGoalMinutes ? ' selected' : '') + '>' + m + ' minuti</option>').join('') + '</select></label></div>' +
      '<label class="check"><input type="checkbox" name="allowSelfRetest"' + (s.allowSelfRetest ? ' checked' : '') + '> Gli studenti possono rifare il test di livello quando vogliono <small class="muted">(altrimenti solo alla scadenza, su tua richiesta o dopo aver completato l\'80% delle lezioni del livello)</small></label>' +
      '<button class="btn primary">Salva</button></form></div>' +
      '<div class="card"><h3>Backup dei dati</h3><p class="small">Scarica regolarmente una copia completa (studenti, progressi, scritti). ' + (IL2.api.mode === 'server' ? 'Il server salva anche una copia automatica ogni giorno nella cartella <code>data/backup</code>.' : 'In modalità locale i dati sono solo in questo browser: il backup è importante.') + '</p>' +
      '<div class="row wrap"><button class="btn" id="exp">Scarica backup</button><label class="btn ghost">Ripristina da backup<input type="file" id="imp" accept="application/json" hidden></label></div></div>' +
      '<div class="card"><h3>Cambia la tua password</h3><form id="pw" class="row wrap"><input name="oldSecret" type="password" placeholder="Password attuale" required autocomplete="current-password"><input name="newSecret" type="password" placeholder="Nuova password (min. 8)" minlength="8" required autocomplete="new-password"><button class="btn">Cambia</button></form></div>' +
      '<div class="card"><h3>Privacy e protezione dei dati</h3><ul class="small"><li>L\'app raccoglie solo i dati necessari alla didattica: nome, lingua d\'origine, gruppo, anno di nascita facoltativo e attività svolte. Non servono email né numeri di telefono.</li><li>I codici di accesso sono salvati solo in forma cifrata (hash).</li><li>Con il server, i dati restano sul computer o server della scuola; nessun dato viene inviato a terzi. La sintesi e il riconoscimento vocale usano le funzioni del browser: in alcuni browser (es. Chrome) il riconoscimento vocale passa dai server del produttore del browser.</li><li>Puoi eliminare in ogni momento uno studente e tutti i suoi dati dalla sua scheda.</li><li>Per l\'uso con minori, la scuola deve inserire l\'app nel proprio registro dei trattamenti e informare le famiglie (vedi guida, sezione Privacy).</li></ul></div>' +
      '<p class="small muted center">Italiano L2 · versione ' + IL2.VERSION + ' · modalità ' + (IL2.api.mode === 'server' ? 'server della scuola' : 'locale') + '</p>';
    view.querySelector('#sf').addEventListener('submit', async e => {
      e.preventDefault(); const f = e.target;
      try { IL2.state.settings = await IL2.api.call('updateSettings', { settings: { schoolName: f.schoolName.value, retestWeeks: f.retestWeeks.value, placementLength: f.placementLength.value, dailyGoalMinutes: f.dailyGoalMinutes.value, allowSelfRetest: f.allowSelfRetest.checked } }); toast('Impostazioni salvate', 'good'); }
      catch (err) { toast(err.message, 'bad'); }
    });
    view.querySelector('#exp').addEventListener('click', async () => { const d = await IL2.api.call('exportData'); download('italiano-l2-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(d)); });
    view.querySelector('#imp').addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      if (!await confirm('Il ripristino sostituisce TUTTI i dati attuali con quelli del backup. Dovrai accedere di nuovo. Procedere?', 'Ripristina', true)) return;
      try { const data = JSON.parse(await file.text()); await IL2.api.call('importData', { data }); toast('Dati ripristinati', 'good'); setTimeout(() => location.reload(), 800); }
      catch (err) { toast('Ripristino non riuscito: ' + err.message, 'bad'); }
    });
    view.querySelector('#pw').addEventListener('submit', async e => { e.preventDefault(); try { await IL2.api.call('changeSecret', Object.fromEntries(new FormData(e.target))); toast('Password cambiata', 'good'); e.target.reset(); } catch (err) { toast(err.message, 'bad'); } });
  };
})();

</script>

</body>
</html>
